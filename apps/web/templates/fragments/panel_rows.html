{% if rows %}
  {% for r in rows %}
  <tr data-ticker="{{ r.ticker }}"{% if r.ccy %} data-ccy="{{ r.ccy }}"{% endif %}{% if r.ley %} data-ley="{{ r.ley }}"{% endif %}>
    {% if r.clickable is defined and not r.clickable %}
    <td class="tk">{{ r.cells[0].text }}</td>
    {% else %}
    <td class="tk"><a hx-get="/bond/{{ r.ticker }}/detail" hx-target="#modal" hx-swap="innerHTML">{{ r.cells[0].text }}</a></td>
    {% endif %}
    {% for c in r.cells[1:] %}<td class="{{ c.cls }}">{{ c.text }}</td>{% endfor %}
  </tr>
  {% endfor %}
{% else %}
  <tr class="empty"><td colspan="{{ ncols }}">Cargando…</td></tr>
{% endif %}
