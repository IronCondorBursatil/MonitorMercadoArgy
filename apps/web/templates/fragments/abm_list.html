<table>
  <thead><tr><th>Ticker(s)</th><th>Hoja</th><th></th></tr></thead>
  <tbody>
    {% for i in instruments %}
    <tr>
      <td>{{ i.display }}</td>
      <td>{{ i.sheet }}</td>
      <td>
        <button hx-get="/abm/form?sheet={{ i.sheet }}&key={{ i.key }}"
                hx-target="#abm-form" hx-swap="innerHTML">editar</button>
        <button class="delx" hx-delete="/abm/instrument/{{ i.key }}"
                hx-target="#abm-list" hx-swap="innerHTML"
                hx-confirm="¿Borrar {{ i.display }} del master?">✕</button>
      </td>
    </tr>
    {% else %}
    <tr class="empty"><td colspan="3">Sin instrumentos</td></tr>
    {% endfor %}
  </tbody>
</table>
