<table>
  <thead><tr><th>Ticker</th><th>Hoja</th><th></th></tr></thead>
  <tbody>
    {% for i in instruments %}
    <tr>
      <td>{{ i.ticker }}</td>
      <td>{{ i.sheet }}</td>
      <td>
        <button hx-get="/abm/form?sheet={{ i.sheet }}&ticker={{ i.ticker }}"
                hx-target="#abm-form" hx-swap="innerHTML">editar</button>
        <button class="delx" hx-delete="/abm/instrument/{{ i.ticker }}"
                hx-target="#abm-list" hx-swap="innerHTML"
                hx-confirm="¿Borrar {{ i.ticker }} del master?">✕</button>
      </td>
    </tr>
    {% else %}
    <tr class="empty"><td colspan="3">Sin instrumentos</td></tr>
    {% endfor %}
  </tbody>
</table>
