<!doctype html>
<html lang="es" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Monitor Renta Fija AR{% endblock %}</title>
  <script src="https://unpkg.com/htmx.org@2.0.3" crossorigin="anonymous"></script>
  <link rel="stylesheet" href="/static/css/app.css">
  <script>
    // Aplicar tema guardado antes del primer paint (evita flash).
    (function () {
      var t = localStorage.getItem("theme");
      if (t) document.documentElement.setAttribute("data-theme", t);
    })();
    function toggleTheme() {
      var h = document.documentElement;
      var t = h.getAttribute("data-theme") === "dark" ? "light" : "dark";
      h.setAttribute("data-theme", t);
      localStorage.setItem("theme", t);
    }
  </script>
  {% block head %}{% endblock %}
</head>
<body>
  <header>
    <h1>MONITOR · Renta Fija AR</h1>
    <span class="meta"><span class="live"></span>{% if last_refresh %}act {{ last_refresh.strftime("%H:%M:%S") }}{% else %}en vivo{% endif %}</span>
    <nav>
      <a href="/">Bonos</a><a href="/curva">Curva</a><a href="/cartera">Cartera</a><a href="/bcra">BCRA</a>
      <a href="/cashflows">Cashflows</a><a href="/escenarios">Escenarios</a><a href="/abm">ABM</a>
      <button class="theme-btn" onclick="toggleTheme()" title="Cambiar tema">◑</button>
    </nav>
  </header>
  {% block content %}{% endblock %}
  <div id="modal"></div>
</body>
</html>
