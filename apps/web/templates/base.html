<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Monitor Renta Fija AR{% endblock %}</title>
  <script src="https://unpkg.com/htmx.org@2.0.3" crossorigin="anonymous"></script>
  <style>
    :root {
      --bg: #0f1115; --panel: #171a21; --head: #1f2430; --line: #2a2f3a;
      --txt: #d7dce5; --mut: #8a93a6; --pos: #3fb950; --neg: #f85149; --accent: #58a6ff;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--txt);
           font: 13px/1.4 "Segoe UI", system-ui, sans-serif; }
    header { display: flex; align-items: baseline; gap: 16px; padding: 10px 16px;
             background: var(--head); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 5; }
    header h1 { font-size: 15px; margin: 0; letter-spacing: .5px; }
    header .meta { color: var(--mut); font-size: 12px; }
    header nav a { color: var(--accent); text-decoration: none; margin-left: 12px; font-size: 12px; }
    main { padding: 14px; display: grid; gap: 14px;
           grid-template-columns: repeat(auto-fit, minmax(440px, 1fr)); }
    .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
    .panel-head { padding: 8px 12px; background: var(--head); border-bottom: 1px solid var(--line);
                  font-weight: 600; font-size: 12px; letter-spacing: .4px; color: #aeb6c4; }
    table { width: 100%; border-collapse: collapse; }
    thead th { text-align: right; padding: 6px 10px; color: var(--mut); font-weight: 600;
               font-size: 11px; border-bottom: 1px solid var(--line); white-space: nowrap; }
    thead th:first-child { text-align: left; }
    tbody td { padding: 5px 10px; border-bottom: 1px solid #20242e; white-space: nowrap; }
    tbody td.num { text-align: right; font-variant-numeric: tabular-nums;
                   font-family: "Consolas", ui-monospace, monospace; }
    tbody tr:hover { background: #1c212b; }
    td.pos { color: var(--pos); } td.neg { color: var(--neg); }
    tbody td:first-child { font-weight: 600; color: #e6eaf0; }
    tr.empty td { color: var(--mut); text-align: center; padding: 14px; font-style: italic; }
  </style>
</head>
<body>
  <header>
    <h1>MONITOR · Renta Fija AR</h1>
    <span class="meta" id="refresh-meta">
      {% if last_refresh %}act: {{ last_refresh.strftime("%H:%M:%S") }}{% else %}esperando datos…{% endif %}
    </span>
    <nav>
      <a href="/">Bonos</a><a href="/cartera">Cartera</a><a href="/bcra">BCRA</a><a href="/cashflows">Cashflows</a>
    </nav>
  </header>
  {% block content %}{% endblock %}
</body>
</html>
