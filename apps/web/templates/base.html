<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Monitor Renta Fija AR{% endblock %}</title>
  <script src="https://unpkg.com/htmx.org@2.0.3" crossorigin="anonymous"></script>
  <style>
    :root {
      --bg: #0f1115; --panel: #171a21; --head: #1f2430; --line: #2a2f3a;
      --txt: #d7dce5; --mut: #8a93a6; --pos: #3fb950; --neg: #f85149; --accent: #58a6ff;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--txt);
           font: 13px/1.4 "Segoe UI", system-ui, sans-serif; }
    header { display: flex; align-items: baseline; gap: 16px; padding: 10px 16px;
             background: var(--head); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 5; }
    header h1 { font-size: 15px; margin: 0; letter-spacing: .5px; }
    header .meta { color: var(--mut); font-size: 12px; }
    header nav a { color: var(--accent); text-decoration: none; margin-left: 12px; font-size: 12px; }
    main { padding: 14px; display: grid; gap: 14px;
           grid-template-columns: repeat(auto-fit, minmax(440px, 1fr)); }
    .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
    .panel-head { padding: 8px 12px; background: var(--head); border-bottom: 1px solid var(--line);
                  font-weight: 600; font-size: 12px; letter-spacing: .4px; color: #aeb6c4; }
    table { width: 100%; border-collapse: collapse; }
    thead th { text-align: right; padding: 6px 10px; color: var(--mut); font-weight: 600;
               font-size: 11px; border-bottom: 1px solid var(--line); white-space: nowrap; }
    thead th:first-child { text-align: left; }
    tbody td { padding: 5px 10px; border-bottom: 1px solid #20242e; white-space: nowrap; }
    tbody td.num { text-align: right; font-variant-numeric: tabular-nums;
                   font-family: "Consolas", ui-monospace, monospace; }
    tbody tr:hover { background: #1c212b; }
    td.pos { color: var(--pos); } td.neg { color: var(--neg); }
    tbody td:first-child { font-weight: 600; color: #e6eaf0; }
    tr.empty td { color: var(--mut); text-align: center; padding: 14px; font-style: italic; }
    td.tk a { color: #e6eaf0; cursor: pointer; text-decoration: none; border-bottom: 1px dotted var(--mut); }
    td.tk a:hover { color: var(--accent); }
    /* modal */
    #modal:empty { display: none; }
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: flex;
                     align-items: flex-start; justify-content: center; z-index: 50; padding: 40px 16px; overflow: auto; }
    .modal-card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
                  width: min(920px, 96vw); box-shadow: 0 10px 40px rgba(0,0,0,.5); }
    .modal-head { display: flex; justify-content: space-between; align-items: center; padding: 10px 16px;
                  background: var(--head); border-bottom: 1px solid var(--line); border-radius: 10px 10px 0 0; }
    .modal-head b { font-size: 15px; } .modal-head .mut { color: var(--mut); font-size: 12px; }
    .modal-body { padding: 14px 16px; max-height: 78vh; overflow: auto; }
    .modal-body.err, .err { color: var(--neg); padding: 20px; text-align: center; }
    .toggle button { background: var(--panel); color: var(--txt); border: 1px solid var(--line);
                     border-radius: 5px; padding: 3px 10px; cursor: pointer; margin-left: 4px; }
    .toggle button.on { background: var(--accent); color: #07223f; border-color: var(--accent); font-weight: 600; }
    .toggle button.x { border: none; background: none; color: var(--mut); font-size: 16px; }
    .md-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
    .modal-body h4 { margin: 12px 0 6px; font-size: 12px; color: var(--accent); letter-spacing: .4px; }
    dl { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; margin: 0; }
    dl dt { color: var(--mut); } dl dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; }
    dl.metrics dd { font-family: "Consolas", ui-monospace, monospace; }
    .calc form { display: inline-flex; gap: 8px; align-items: center; margin: 4px 12px 8px 0; }
    .calc input { background: var(--bg); border: 1px solid var(--line); color: var(--txt); padding: 4px 6px; border-radius: 4px; width: 110px; }
    .calc button { background: var(--accent); color: #07223f; border: none; border-radius: 5px; padding: 5px 10px; cursor: pointer; font-weight: 600; }
    #calc-result { margin-top: 6px; }
    table.cf { width: 100%; border-collapse: collapse; margin-top: 4px; }
    table.cf th { text-align: right; color: var(--mut); font-size: 11px; padding: 4px 8px; border-bottom: 1px solid var(--line); }
    table.cf th:first-child, table.cf th:nth-child(2) { text-align: left; }
    table.cf td { padding: 3px 8px; border-bottom: 1px solid #20242e; }
    table.cf td.num { text-align: right; font-variant-numeric: tabular-nums; font-family: "Consolas", monospace; }
    table.cf tr.past { opacity: .5; } table.cf tr.next { background: rgba(88,166,255,.12); font-weight: 600; }
    @media (max-width: 640px) { .md-cols { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header>
    <h1>MONITOR · Renta Fija AR</h1>
    <span class="meta" id="refresh-meta">
      {% if last_refresh %}act: {{ last_refresh.strftime("%H:%M:%S") }}{% else %}esperando datos…{% endif %}
    </span>
    <nav>
      <a href="/">Bonos</a><a href="/cartera">Cartera</a><a href="/bcra">BCRA</a><a href="/cashflows">Cashflows</a><a href="/abm">ABM</a>
    </nav>
  </header>
  {% block content %}{% endblock %}
  <div id="modal"></div>
</body>
</html>
