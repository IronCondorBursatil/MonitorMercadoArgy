<!doctype html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Acceso - Monitor Renta Fija AR</title>
  <link rel="stylesheet" href="/static/css/app.css">
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: var(--bg);
      font-family: system-ui, sans-serif;
    }
    .login-box {
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 2rem;
      border-radius: 8px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    .login-box h1 {
      text-align: center;
      margin-top: 0;
      color: var(--text);
    }
    .login-form {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      margin-top: 1.5rem;
    }
    .login-form label {
      font-weight: 500;
      font-size: 0.9rem;
      color: var(--text-dim);
    }
    .login-form input {
      padding: 0.75rem;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      border-radius: 4px;
      font-size: 1rem;
    }
    .login-form button {
      background: var(--text);
      color: var(--bg);
      border: none;
      padding: 0.75rem;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 4px;
      cursor: pointer;
      margin-top: 0.5rem;
    }
    .login-form button:hover {
      opacity: 0.9;
    }
    .error-msg {
      background: #fecdd3;
      color: #9f1239;
      padding: 0.75rem;
      border-radius: 4px;
      font-size: 0.9rem;
      margin-bottom: 1rem;
      text-align: center;
    }
    [data-theme="dark"] .error-msg {
      background: #4c1d95;
      color: #ddd6fe;
    }
  </style>
</head>
<body>
  <div class="login-box">
    <h1>MONITOR AR</h1>
    {% if error %}
      <div class="error-msg">{{ error }}</div>
    {% endif %}
    <form class="login-form" method="POST" action="/login">
      <div>
        <label for="username">Usuario</label><br>
        <input type="text" id="username" name="username" required autofocus style="width: 100%; box-sizing: border-box;">
      </div>
      <div>
        <label for="password">Contraseña</label><br>
        <input type="password" id="password" name="password" required style="width: 100%; box-sizing: border-box;">
      </div>
      <button type="submit">Ingresar</button>
    </form>
  </div>
</body>
</html>
