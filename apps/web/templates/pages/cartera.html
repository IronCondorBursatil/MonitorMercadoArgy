{% extends "base.html" %}
{% block content %}
<main style="display:block">
  <section class="panel" style="margin-bottom:14px">
    <div class="panel-head">AGREGAR / EDITAR TENENCIA</div>
    <form class="cartera-add" hx-post="/cartera/holding" hx-target="#cartera-body" hx-swap="innerHTML"
          hx-on::after-request="this.reset()">
      <input name="ticker" placeholder="Ticker" required>
      <input name="nominal" type="number" step="1" placeholder="Nominal (VN)" required>
      <input name="cost_price" type="number" step="0.01" placeholder="Precio costo (opc.)">
      <input name="note" placeholder="Nota (opc.)">
      <button type="submit">Guardar</button>
    </form>
  </section>
  <div id="cartera-body">
    {% include "fragments/cartera_body.html" %}
  </div>
</main>
<style>
  .cartera-add { display:flex; gap:8px; padding:10px 12px; flex-wrap:wrap; }
  .cartera-add input { background:var(--bg); border:1px solid var(--line); color:var(--txt); padding:6px 8px; border-radius:4px; }
  .cartera-add button { background:var(--accent); color:#07223f; border:none; border-radius:5px; padding:6px 14px; cursor:pointer; font-weight:600; }
  .cards { display:flex; gap:12px; flex-wrap:wrap; padding:12px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:10px 14px; min-width:150px; }
  .card .k { color:var(--mut); font-size:11px; } .card .v { font-size:18px; font-variant-numeric:tabular-nums; margin-top:2px; }
  .delx { background:none; border:none; color:var(--neg); cursor:pointer; }
</style>
{% endblock %}
