{% extends "base.html" %}
{% block content %}
<main style="display:block">
  <section class="panel" style="margin:14px">
    <div class="panel-head">
      <span>FCI · FONDOS (CAFCI{% if meta.fecha_base %} · {{ meta.fecha_base }}{% endif %})</span>
    </div>
    <form class="fci-filters" hx-get="/fci/rows" hx-target="#fci-rows" hx-swap="innerHTML"
          hx-trigger="change, keyup delay:400ms from:input[name='q']">
      <select name="tipo"><option value="">Todos los tipos</option>
        {% for t in tipos %}<option value="{{ t }}">{{ t }}</option>{% endfor %}</select>
      <select name="moneda"><option value="">Todas las monedas</option>
        {% for m in monedas %}<option value="{{ m }}">{{ m }}</option>{% endfor %}</select>
      <input name="q" placeholder="Buscar fondo / sociedad…">
      <select name="sort">
        {% for p in periods %}<option value="{{ p }}" {{ 'selected' if p == 'mes_1' else '' }}>orden: {{ labels[p] }}</option>{% endfor %}</select>
      <select name="metric"><option value="tna">TNA</option><option value="directo">Directo</option></select>
    </form>
    <div id="fci-rows">{% include "fragments/fci_rows.html" %}</div>
  </section>
</main>
<style>
  .fci-filters { display:flex; gap:8px; padding:11px 13px; flex-wrap:wrap; }
  th.sortcol, td.sortcol { background: var(--accent-light); }
</style>
{% endblock %}
