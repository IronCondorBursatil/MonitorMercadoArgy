services:
  - type: web
    name: monitor-mercado-argy
    env: docker
    plan: free
    healthCheckPath: /
    envVars:
      - key: PORT
        value: 8000
      # MONITOR_PORT mapea a la misma variable que espera nuestro settings
      - key: MONITOR_PORT
        value: 8000
      - key: MONITOR_HOST
        value: 0.0.0.0
      - key: OMP_NUM_THREADS
        value: "1"
      - key: OPENBLAS_NUM_THREADS
        value: "1"
      - key: MKL_NUM_THREADS
        value: "1"
      - key: MONITOR_ENGINE_WORKERS
        value: "1"
      - key: MONITOR_BYMA_HISTORY_WORKERS
        value: "1"
      - key: MONITOR_BYMA_HISTORY_MAX_DAYS
        value: "30"
