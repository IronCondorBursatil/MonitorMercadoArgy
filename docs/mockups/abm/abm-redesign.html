<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ABM Redesign · 24 mocks interactivos</title>
<style>
:root{
  --navy:#0a1d4a; --navy-dark:#06143b; --navy-band:#142a66;
  --accent:#3a5fcf; --accent-light:#dde5fb; --tir-hl:rgba(58,95,207,.14);
  --page-bg:#f3f5fa; --panel-bg:#fff; --panel-border:#d2d8e6;
  --row-alt:#f6f8fc; --row-hover:#eef2fb; --head-bg:#0a1d4a;
  --text:#0e1834; --text-dim:#4a5780; --text-faint:#8993b8;
  --pos:#0d6e3a; --neg:#a8242b; --live:#37d67a; --amber:#c07a1a;
  --font-body:"Inter Tight",-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:"JetBrains Mono","SF Mono",Consolas,monospace;
  --radius:8px; --shadow:0 1px 3px rgba(10,29,74,.07);
}
[data-theme="dark"]{
  --navy:#102452; --navy-dark:#0a1738; --navy-band:#1c3170;
  --accent:#6486e6; --accent-light:#17264c; --tir-hl:rgba(100,134,230,.22);
  --page-bg:#070f24; --panel-bg:#0f1b3a; --panel-border:#26345a;
  --row-alt:#13203f; --row-hover:#1b2b50; --head-bg:#102452;
  --text:#e9edf7; --text-dim:#aab4d4; --text-faint:#8893bb;
  --pos:#4fcf85; --neg:#f28a8f; --amber:#e6a94f;
}
*{box-sizing:border-box}
body{margin:0;background:var(--page-bg);color:var(--text);font:13px/1.45 var(--font-body)}
.num{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.pos{color:var(--pos)} .neg{color:var(--neg)} .dim{color:var(--text-dim)} .faint{color:var(--text-faint)}
.mono{font-family:var(--font-mono)}

/* ---- app shell ---- */
.app{display:grid;grid-template-columns:268px 1fr;grid-template-rows:auto 1fr;height:100vh}
.topbar{grid-column:1/3;display:flex;align-items:center;gap:14px;background:var(--head-bg);color:#fff;padding:0 16px;height:50px}
.topbar h1{font-size:14px;margin:0;font-weight:700;letter-spacing:.3px}
.topbar .sub{color:#b9c5ea;font-size:11.5px}
.topbar .sp{flex:1}
.topbar button{background:rgba(255,255,255,.12);color:#fff;border:none;border-radius:6px;padding:6px 11px;cursor:pointer;font:600 12px var(--font-body)}
.topbar button:hover{background:rgba(255,255,255,.22)}

.nav{background:var(--panel-bg);border-right:1px solid var(--panel-border);overflow-y:auto;padding:8px 0 40px}
.nav .grp{font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--text-faint);font-weight:700;padding:12px 16px 5px}
.nav a{display:flex;gap:9px;align-items:baseline;padding:7px 16px;cursor:pointer;color:var(--text-dim);border-left:3px solid transparent;font-size:12.5px}
.nav a:hover{background:var(--row-hover);color:var(--text)}
.nav a.on{background:var(--accent-light);color:var(--accent);border-left-color:var(--accent);font-weight:600}
.nav a .n{font:700 10px var(--font-mono);color:var(--text-faint);min-width:20px}
.nav a.on .n{color:var(--accent)}

.stage{overflow:auto;position:relative;padding:0}
.stagehdr{position:sticky;top:0;z-index:4;background:var(--panel-bg);border-bottom:1px solid var(--panel-border);padding:11px 18px}
.stagehdr h2{margin:0;font-size:15px}
.stagehdr p{margin:3px 0 0;color:var(--text-dim);font-size:12px}
.stagehdr .tag{display:inline-block;font:700 10px var(--font-mono);background:var(--tir-hl);color:var(--accent);padding:1px 7px;border-radius:9px;margin-right:7px}
.stagebody{padding:16px 18px 60px}

/* ---- generic bits ---- */
.panel{background:var(--panel-bg);border:1px solid var(--panel-border);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.panel-head{padding:8px 13px;background:var(--navy-band);color:#fff;font:700 12px var(--font-body);letter-spacing:.3px;display:flex;align-items:center;gap:8px}
.panel-head .sp{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:11px}
.chip{background:var(--panel-bg);border:1px solid var(--panel-border);border-radius:20px;padding:3px 12px;font-size:11.5px;cursor:pointer;color:var(--text-dim)}
.chip.on{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:700}
.btn{background:var(--accent);color:#fff;border:none;border-radius:6px;padding:6px 13px;cursor:pointer;font:600 12px var(--font-body)}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.btn.sm{padding:3px 9px;font-size:11px}
.tbar{display:flex;gap:8px;align-items:center;margin-bottom:11px;flex-wrap:wrap}
input,select{background:var(--panel-bg);border:1px solid var(--panel-border);color:var(--text);border-radius:6px;padding:6px 9px;font:inherit}
.in{min-width:180px}

/* ---- tables ---- */
table.t{width:100%;border-collapse:collapse;font-size:12.5px}
table.t thead th{position:sticky;top:0;background:var(--head-bg);color:#fff;font-weight:600;font-size:10.5px;text-transform:uppercase;letter-spacing:.3px;padding:7px 9px;text-align:right;white-space:nowrap;cursor:pointer}
table.t thead th:first-child,table.t tbody td:first-child{text-align:left}
table.t tbody td{padding:6px 9px;text-align:right;border-bottom:1px solid var(--panel-border);white-space:nowrap}
table.t tbody tr:nth-child(even){background:var(--row-alt)}
table.t tbody tr:hover{background:var(--row-hover)}
.tk{font:700 12px var(--font-mono);color:var(--accent)}
.miss{background:rgba(168,36,43,.13);color:var(--neg);border-radius:4px;font-weight:700}
.miss-opt{background:rgba(192,122,26,.16);color:var(--amber);border-radius:4px}
[data-theme="dark"] .miss-opt{color:var(--amber)}
.ok{color:var(--pos);font-weight:700}
.no{color:var(--text-faint)}
.pill{display:inline-block;font:700 9.5px var(--font-body);padding:1px 6px;border-radius:9px}
.pill.hd{background:rgba(13,110,58,.14);color:var(--pos)} .pill.dl{background:rgba(168,36,43,.13);color:var(--neg)}
.pill.ar{background:var(--accent-light);color:var(--accent)} .pill.ext{background:rgba(237,139,54,.18);color:#c07020}

/* completeness */
.cbar{display:inline-flex;align-items:center;gap:7px}
.cbar .bar{width:74px;height:7px;border-radius:4px;background:var(--panel-border);overflow:hidden}
.cbar .bar i{display:block;height:100%;border-radius:4px}
.cpct{font:700 11px var(--font-mono);min-width:34px;text-align:right}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block}
.dot.g{background:var(--pos)} .dot.a{background:var(--amber)} .dot.r{background:var(--neg)}
.fchip{display:inline-block;font-size:10px;background:rgba(168,36,43,.12);color:var(--neg);border-radius:8px;padding:1px 7px;margin:1px 3px 1px 0}

/* ring */
.ring{--p:0;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;
  background:conic-gradient(var(--rc,var(--accent)) calc(var(--p)*1%), var(--panel-border) 0)}
.ring i{width:36px;height:36px;border-radius:50%;background:var(--panel-bg);display:grid;place-items:center;font:700 11px var(--font-mono)}
.cardgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:11px}
.icard{border:1px solid var(--panel-border);border-radius:var(--radius);background:var(--panel-bg);padding:11px 12px;box-shadow:var(--shadow)}
.icard .top{display:flex;align-items:center;gap:10px}
.icard .meta{flex:1;min-width:0}
.icard .em{font-size:11px;color:var(--text-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icard .flags{display:flex;gap:5px;margin-top:9px;flex-wrap:wrap}
.fl{font-size:10px;padding:1px 7px;border-radius:8px;border:1px solid var(--panel-border);color:var(--text-dim)}
.fl.bad{border-color:var(--neg);color:var(--neg);background:rgba(168,36,43,.08)}
.fl.good{border-color:var(--pos);color:var(--pos)}

/* matrix / heatmap */
table.mx td.c{text-align:center;font-weight:700}
.cellok{color:var(--pos)} .cellpart{color:var(--amber)} .cellno{color:var(--neg)}
.hm td{padding:0!important}
.hm .hc{height:26px;display:grid;place-items:center;font:700 10px var(--font-mono);color:#fff;margin:1px}
.hm .full{background:#1f8a4c} .hm .opt{background:#c79a3a} .hm .empty{background:#bb3b46}

/* universe */
table.u{width:100%;border-collapse:collapse;font-size:12px}
table.u thead th{position:sticky;background:var(--head-bg);color:#fff;font-weight:600;font-size:10px;text-transform:uppercase;letter-spacing:.3px;padding:6px 8px;text-align:right;white-space:nowrap}
table.u thead .l1 th{top:0}
table.u thead .l2 th{top:25px}
table.u thead th.grp{text-align:center;border-left:1px solid var(--panel-border)}
table.u thead th.l{text-align:left}
table.u tbody td{padding:5px 8px;border-bottom:1px solid var(--panel-border);text-align:right;white-space:nowrap;font-size:11.5px}
table.u tbody td.l{text-align:left}
table.u tbody td.sep{border-left:1px solid var(--panel-border)}
table.u tbody tr:hover{background:var(--row-hover)}
.ualta{text-align:center;font:700 13px var(--font-mono)}
.ualta.y{color:var(--pos)} .ualta.n{color:var(--text-faint)}
.uvol{font:600 11px var(--font-mono);color:var(--text-dim)}
.utk{font:700 11.5px var(--font-mono);cursor:default;position:relative}
.utk.priced{color:#1ea672}            /* tiene precio LAST/CLOSE */
.utk.priced.close{color:#2f7fd0}      /* solo CLOSE (cierre previo) */
.utk.noprice{color:var(--text-faint)}
.utk.priced[data-tip]:hover::after{content:attr(data-tip);position:absolute;left:0;bottom:140%;background:var(--navy-dark);color:#fff;font:600 10.5px var(--font-mono);padding:4px 8px;border-radius:6px;white-space:nowrap;z-index:9;box-shadow:0 6px 18px rgba(0,0,0,.3)}
.uplus{background:var(--accent);color:#fff;border:none;border-radius:5px;width:20px;height:20px;cursor:pointer;font-weight:700;line-height:1}
.uplus:hover{filter:brightness(1.1)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--text-dim);margin-bottom:9px}
.legend b{font-family:var(--font-mono)}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(4,9,26,.5);opacity:0;pointer-events:none;transition:opacity .22s;z-index:40}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(760px,94vw);background:var(--panel-bg);border-left:1px solid var(--panel-border);
  box-shadow:-18px 0 44px -22px rgba(0,0,0,.6);transform:translateX(100%);transition:transform .26s ease;z-index:41;display:flex;flex-direction:column}
.drawer.wide{width:min(940px,96vw)}
.drawer.on{transform:translateX(0)}
.dhead{display:flex;align-items:center;gap:11px;padding:11px 15px;background:var(--navy-band);color:#fff;flex:0 0 auto}
.dhead .t{font-weight:700}.dhead .t b{color:#fff}
.dhead .sp{flex:1}
.dhead .x{background:rgba(255,255,255,.14);border:none;color:#fff;width:28px;height:28px;border-radius:6px;cursor:pointer;font-size:15px}
.dbody{overflow:auto;flex:1 1 auto;padding:14px 16px 28px}
.dtabs{display:flex;gap:3px;border-bottom:1px solid var(--panel-border);margin:-4px 0 12px}
.dtab{background:none;border:none;border-bottom:2px solid transparent;color:var(--text-faint);font:700 12px var(--font-body);padding:8px 13px;cursor:pointer;margin-bottom:-1px}
.dtab.on{color:var(--accent);border-bottom-color:var(--accent)}
.sec{font:700 11px var(--font-body);color:var(--accent);text-transform:uppercase;letter-spacing:.4px;margin:16px 0 9px;border-bottom:1px solid var(--panel-border);padding-bottom:5px}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.fld{display:flex;flex-direction:column;gap:3px}
.fld span{font-size:11px;color:var(--text-dim)}
.fld input,.fld select{padding:6px 8px}
.fld.empty input,.fld.empty select{border-color:var(--neg);background:rgba(168,36,43,.06)}
.fld.empty.opt input,.fld.empty.opt select{border-color:var(--amber);background:rgba(192,122,26,.07)}
.fld .req{color:var(--neg)}
.tiles{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.tile{border:1px solid var(--panel-border);border-radius:8px;padding:9px 6px;text-align:center}
.tile .v{font:700 16px var(--font-mono)} .tile .k{font-size:9.5px;color:var(--text-faint);text-transform:uppercase;margin-top:2px}
table.cf{width:100%;border-collapse:collapse;font-size:11.5px}
table.cf th{font-size:9.5px;color:var(--text-faint);text-transform:uppercase;text-align:right;padding:5px 8px;border-bottom:1px solid var(--panel-border)}
table.cf th:first-child{text-align:left}
table.cf td{padding:4px 8px;text-align:right;border-bottom:1px solid var(--panel-border);font-family:var(--font-mono);font-size:11px}
table.cf td:first-child{text-align:left}
.cf-x{color:var(--neg);cursor:pointer;border:none;background:none}
.d2{display:grid;grid-template-columns:1.1fr 1fr;gap:18px}
.dfoot{position:sticky;bottom:0;background:var(--panel-bg);border-top:1px solid var(--panel-border);padding:10px 16px;display:flex;gap:10px;align-items:center}
.flash{color:var(--pos);font-weight:700}
.dprog{height:6px;border-radius:4px;background:var(--panel-border);overflow:hidden;width:120px}
.dprog i{display:block;height:100%}

/* shells */
.toggle{display:flex;gap:6px;margin-bottom:12px}
.toggle button{background:var(--panel-bg);border:1px solid var(--panel-border);color:var(--text-dim);border-radius:7px;padding:7px 15px;cursor:pointer;font:600 12px var(--font-body)}
.toggle button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.seg{display:inline-flex;border:1px solid var(--panel-border);border-radius:9px;overflow:hidden;margin-bottom:12px}
.seg button{background:var(--panel-bg);border:none;color:var(--text-dim);padding:8px 16px;cursor:pointer;font:600 12px var(--font-body)}
.seg button+button{border-left:1px solid var(--panel-border)}
.seg button.on{background:var(--accent);color:#fff}
.seg .badge{font:700 10px var(--font-mono);background:rgba(255,255,255,.25);border-radius:9px;padding:0 6px;margin-left:6px}
.tri{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.dock{border:1px solid var(--panel-border);border-radius:var(--radius);background:var(--panel-bg);min-height:300px}
.sidecol{display:grid;grid-template-columns:300px 1fr;gap:12px}

/* command palette */
.palette{position:fixed;inset:0;display:none;place-items:start center;padding-top:14vh;background:rgba(4,9,26,.4);z-index:50}
.palette.on{display:grid}
.pbox{width:min(560px,92vw);background:var(--panel-bg);border:1px solid var(--panel-border);border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.4);overflow:hidden}
.pbox input{width:100%;border:none;border-bottom:1px solid var(--panel-border);border-radius:0;padding:13px 16px;font-size:15px}
.pbox .res{max-height:320px;overflow:auto}
.pbox .ri{padding:9px 16px;cursor:pointer;display:flex;gap:10px;align-items:center}
.pbox .ri:hover,.pbox .ri.sel{background:var(--accent-light)}
.kbd{font:700 10px var(--font-mono);border:1px solid var(--panel-border);border-radius:4px;padding:1px 5px;color:var(--text-dim)}
.note{color:var(--text-faint);font-size:11.5px;font-style:italic;margin-top:10px}
.livebadge{display:inline-flex;align-items:center;gap:6px;font:700 11px var(--font-body);color:var(--pos)}
.livebadge .d{width:8px;height:8px;border-radius:50%;background:var(--live);animation:pulse 1.4s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.colmenu{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:11px}
.colmenu label{display:flex;gap:5px;align-items:center;font-size:11.5px;border:1px solid var(--panel-border);border-radius:7px;padding:4px 9px;cursor:pointer}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <h1>ABM Redesign</h1>
    <span class="sub">24 mocks interactivos · tabla de completitud · cajón editor · Universo dinámico</span>
    <span class="sp"></span>
    <button onclick="toggleTheme()" id="themebtn">☾ Oscuro</button>
  </div>
  <nav class="nav" id="nav"></nav>
  <main class="stage">
    <div class="stagehdr"><h2 id="mTitle">—</h2><p id="mDesc">—</p></div>
    <div class="stagebody" id="stage"></div>
  </main>
</div>

<div class="scrim" id="scrim" onclick="closeDrawer()"></div>
<div class="drawer" id="drawer">
  <div class="dhead"><span class="t" id="dTitle">Editor</span><span class="sp"></span><button class="x" onclick="closeDrawer()">✕</button></div>
  <div class="dbody" id="dBody"></div>
</div>

<div class="palette" id="palette"><div class="pbox">
  <input id="palInput" placeholder="Saltar a ticker / acción…  (Esc cierra)" oninput="palFilter()">
  <div class="res" id="palRes"></div>
</div></div>

<script>
/* ======================= DATOS DE EJEMPLO ======================= */
// spec de campos por hoja: {k,label,req,grp}
var GRP=["Términos","Fechas","Cupón","Base","ISIN","CF","Precio"];
function C(k,label,req,grp){return {k:k,label:label,req:!!req,grp:grp};}
var COMMON_TAIL=[C("isin","ISIN",false,"ISIN"),C("cashflows","Cashflows",true,"CF"),C("precio","Precio",false,"Precio")];
var SHEETS={
 "Soberanos":{label:"Soberanos",cols:[C("ticker_ars","Ticker",true,"Términos"),C("short_name","Nombre",true,"Términos"),C("tipo","Tipo",true,"Términos"),
   C("fecha_emision","Emisión",true,"Fechas"),C("fecha_vencimiento","Vto",true,"Fechas"),C("cupon","Cupón%",true,"Cupón"),
   C("frecuencia","Freq",false,"Cupón"),C("base","Base",false,"Base"),C("tipo_amort","Amort",false,"Base")].concat(COMMON_TAIL)},
 "CER":{label:"CER",cols:[C("ticker_ars","Ticker",true,"Términos"),C("short_name","Nombre",true,"Términos"),C("tipo","Tipo",true,"Términos"),
   C("fecha_emision","Emisión",true,"Fechas"),C("fecha_vencimiento","Vto",true,"Fechas"),C("cupon","Cupón%",false,"Cupón"),
   C("frecuencia","Freq",false,"Cupón"),C("cer_base","CER base",true,"Base")].concat(COMMON_TAIL)},
 "Tasa_Fija":{label:"Tasa Fija",cols:[C("ticker_ars","Ticker",true,"Términos"),C("clase","Clase",true,"Términos"),
   C("fecha_emision","Emisión",true,"Fechas"),C("fecha_vencimiento","Vto",true,"Fechas"),C("tem_licit","TEM",false,"Cupón"),
   C("base","Base",false,"Base")].concat(COMMON_TAIL)},
 "Dolar_Linked":{label:"Dólar Linked",cols:[C("ticker_ars","Ticker",true,"Términos"),C("short_name","Nombre",true,"Términos"),
   C("fecha_emision","Emisión",true,"Fechas"),C("fecha_vencimiento","Vto",true,"Fechas"),C("cupon","Cupón%",false,"Cupón"),
   C("base","Base",false,"Base"),C("tc_inicial","TC ini",false,"Cupón"),C("tipo_amort","Amort",false,"Base")].concat(COMMON_TAIL)},
 "TAMAR":{label:"TAMAR",cols:[C("ticker_ars","Ticker",true,"Términos"),C("tipo","Tipo",true,"Términos"),
   C("fecha_emision","Emisión",true,"Fechas"),C("fecha_vencimiento","Vto",true,"Fechas"),C("spread","Spread",false,"Cupón"),
   C("base","Base",false,"Base"),C("cer_base","CER base",false,"Base")].concat(COMMON_TAIL)},
 "Obligaciones_Negociables":{label:"ON",cols:[C("ticker_ars","Ticker",true,"Términos"),C("short_name","Emisor",true,"Términos"),
   C("tipo","Tipo",true,"Términos"),C("ley_aplicable","Ley",false,"Términos"),C("serie_clase","Clase",false,"Términos"),
   C("sector_override","Sector",false,"Términos"),C("fecha_emision","Emisión",true,"Fechas"),C("fecha_vencimiento","Vto",true,"Fechas"),
   C("cupon","Cupón%",true,"Cupón"),C("frecuencia","Freq",true,"Cupón"),C("base","Base",true,"Base"),
   C("tipo_amort","Amort",false,"Base")].concat(COMMON_TAIL)}
};

// instrumentos cargados (mix completos/incompletos). v = valores; faltan keys => vacío.
function cf3(){return [["24/08/25",4.22,0],["24/02/26",4.28,0],["24/08/26",4.22,0],["24/02/27",4.28,100]];}
var INST=[

function coverage(it){
  var cols=SHEETS[it.sheet].cols, filled=0, missReq=[], missOpt=[];
  cols.forEach(function(c){
    var has = c.k==="cashflows" ? (it.cf&&it.cf.length>0) : !!(it.v&&it.v[c.k]!=null&&String(it.v[c.k]).trim()!=="");
    if(has) filled++; else (c.req?missReq:missOpt).push(c);
  });
  var pct=Math.round(100*filled/cols.length);
  var health = missReq.length? "r" : (missOpt.length? "a":"g");
  return {pct:pct,filled:filled,total:cols.length,missReq:missReq,missOpt:missOpt,health:health};
}

function valCell(it,c){
  var v=it.v?it.v[c.k]:null, empty=(c.k==="cashflows")?!(it.cf&&it.cf.length):(v==null||String(v).trim()==="");
  if(c.k==="cashflows") return it.cf&&it.cf.length?'<span class="num ok">✓ '+it.cf.length+'</span>':'<span class="no miss">✗</span>';
  if(c.k==="precio") return v?'<span class="num">'+v+'</span>':'<span class="no miss-opt">sin px</span>';
  if(c.k==="ticker_ars") return '<span class="tk">'+esc(v||it.tk)+'</span>';
  if(empty) return '<span class="'+(c.req?"miss":"miss-opt")+'">'+(c.req?"falta":"—")+'</span>';
  if(c.k==="tipo") return '<span class="pill '+(String(v).indexOf("DOLLAR")>=0?"hd":"")+'">'+esc(v)+'</span>';
  if(c.k==="ley_aplicable") return '<span class="pill '+(String(v).indexOf("Arg")>=0?"ar":"ext")+'">'+esc(v).slice(0,3)+'</span>';
  var s=String(v); if(s.length>16)s=s.slice(0,15)+'…';

  opts=opts||{};

  var head='<tr><th>Salud</th>'+cols.map(function(c){return '<th title="'+(c.req?'requerido':'opcional')+'">'+c.label+(c.req?' *':'')+'</th>';}).join("")+'<th>Compl.</th><th></th></tr>';

}

/* ======================= NAV + ROUTER ======================= */
var M={cur:0,render:function(){var s=$("stage"); s._timer&&clearInterval(s._timer); MOCKS[M.cur].render(s);}};
function buildNav(){
  var html="", lastG=null, idx=0;
  MOCKS.forEach(function(m,i){
    if(m.g!==lastG){html+='<div class="grp">'+m.g+'</div>'; lastG=m.g;}
    html+='<a id="nav'+i+'" onclick="go('+i+')"><span class="n">'+(i+1)+'</span><span>'+m.n+'</span></a>';
  });
  $("nav").innerHTML=html;
}
function go(i){
  M.cur=i; var s=$("stage");
  for(var j=0;j<MOCKS.length;j++){var a=$("nav"+j); if(a)a.classList.toggle("on",j===i);}
  $("mTitle").innerHTML='<span class="tag">#'+(i+1)+'</span>'+MOCKS[i].n;
  $("mDesc").textContent=MOCKS[i].d;
  s.innerHTML=""; s._sheet=null; s._v=null; s._open=null;
  MOCKS[i].render(s);
}
function toggleTheme(){
  var h=document.documentElement; var d=h.getAttribute("data-theme")==="dark";
  h.setAttribute("data-theme",d?"light":"dark"); $("themebtn").textContent=d?"☾ Oscuro":"☀ Claro";
}
/* command palette */
var PAL=[];
function buildPal(){
  PAL=INST.map(function(it){return {t:(it.v.ticker_ars||it.tk),sub:it.v.short_name||SHEETS[it.sheet].label,act:function(){openEditor(it.id,"stack");}};});
  UNI.filter(function(u){return !u.loaded;}).forEach(function(u,i){PAL.push({t:u.base,sub:"＋ alta · "+u.emisor,act:function(){openAlta(u);}});});
}
function openPalette(){$("palette").classList.add("on"); $("palInput").value=""; palFilter(); $("palInput").focus();}
function closePalette(){$("palette").classList.remove("on");}
function palFilter(){
  var q=($("palInput").value||"").toLowerCase();
  var r=PAL.filter(function(p){return p.t.toLowerCase().indexOf(q)>=0||(p.sub||"").toLowerCase().indexOf(q)>=0;}).slice(0,12);
  $("palRes").innerHTML=r.map(function(p,i){return '<div class="ri" onclick="palPick('+PAL.indexOf(p)+')"><span class="tk">'+p.t+'</span><span class="faint">'+p.sub+'</span></div>';}).join("")||'<div class="ri faint">sin resultados</div>';
}
function palPick(i){closePalette(); PAL[i].act();}

document.addEventListener("keydown",function(e){
  if(e.key==="Escape"){closeDrawer();closePalette();}
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="k"){e.preventDefault();openPalette();}
  if(e.key==="/"&&!/input|select|textarea/i.test((e.target.tagName||""))){e.preventDefault();openPalette();}
});

buildNav(); buildPal(); go(0);
</script>
