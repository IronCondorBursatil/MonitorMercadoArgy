<!doctype html>
<html lang="es" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ON Unificado · Split redimensionable</title>
<link rel="stylesheet" href="../_shared/theme.css">
<link rel="stylesheet" href="../_shared/unified.css">
<style>
  /* ---- LAYOUT: shell a 100vh, header + split horizontal ---- */
  html, body { height: 100%; margin: 0; }
  .app { display: flex; flex-direction: column; height: 100vh; min-height: 0; }

  /* header terminal */
  .v-head { display: flex; align-items: center; gap: 12px; padding: 9px 18px;
    background: var(--head-bg); color: var(--text-white); box-shadow: var(--shadow-panel);
    flex: 0 0 auto; z-index: 50; }
  .v-head h1 { font-size: 14px; margin: 0; font-weight: 700; letter-spacing: .5px;
    white-space: nowrap; font-family: var(--font-mono); }
  .v-head .sub { color: #c7d0ee; font-size: 11.5px; }
  .v-head .gen { color: #8fa0d6; font-size: 10.5px; margin-left: 14px; white-space: nowrap; }
  .v-head .spacer { margin-left: auto; }
  .v-head .badge { background: #e8843a; color: #311; font-weight: 700; font-size: 10.5px;
    padding: 2px 7px; border-radius: 10px; }
  .v-head .tbtn { background: rgba(255,255,255,.12); border: none; color: #fff; cursor: pointer;
    border-radius: 6px; padding: 5px 10px; font-size: 14px; line-height: 1; }
  .v-head .tbtn:hover { background: rgba(255,255,255,.22); }

  /* split: tabla | divisor | gráfico */
  .split { flex: 1 1 auto; display: flex; min-height: 0; padding: 10px; gap: 0; }

  /* panel tabla (izquierda) */
  .pane-table { min-width: 320px; min-height: 0; display: flex; flex-direction: column;
    background: var(--panel-bg); border: 1px solid var(--panel-border);
    border-radius: var(--radius); box-shadow: var(--shadow-panel); overflow: hidden; }
  #tool { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; }

  /* divisor arrastrable */
  .divider { flex: 0 0 10px; align-self: stretch; cursor: col-resize; position: relative;
    display: flex; align-items: center; justify-content: center; }
  .divider::before { content: ""; position: absolute; top: 8px; bottom: 8px; left: 50%;
    transform: translateX(-50%); width: 2px; border-radius: 2px; background: var(--panel-border);
    transition: background .15s, width .15s; }
  .divider:hover::before, .divider.dragging::before { background: var(--accent); width: 4px; }
  .divider .grip { position: relative; z-index: 1; display: flex; flex-direction: column; gap: 3px;
    pointer-events: none; opacity: .55; transition: opacity .15s; }
  .divider:hover .grip, .divider.dragging .grip { opacity: 1; }
  .divider .grip i { width: 3px; height: 3px; border-radius: 50%; background: var(--text-faint); }
  .divider:hover .grip i, .divider.dragging .grip i { background: var(--accent); }

  /* panel gráfico (derecha) */
  .pane-chart { min-width: 320px; min-height: 0; display: flex; flex-direction: column;
    background: var(--panel-bg); border: 1px solid var(--panel-border);
    border-radius: var(--radius); box-shadow: var(--shadow-panel); overflow: hidden; }
  .pane-chart .ph { display: flex; align-items: center; gap: 8px; padding: 9px 14px;
    background: var(--navy-band); color: #fff; font-weight: 700; font-size: 12.5px;
    letter-spacing: .4px; flex: 0 0 auto; }
  .pane-chart .ph .hint { margin-left: auto; font-weight: 500; font-size: 10.5px; color: #c7d0ee; }
  .chart-box { flex: 1 1 auto; position: relative; min-height: 0; padding: 12px 14px 14px; }
  .chart-box canvas { position: absolute; inset: 12px 14px 14px; }

  /* while dragging: kill text selection + iframe-like cursor */
  body.dragging { cursor: col-resize; user-select: none; }
  body.dragging .pane-chart, body.dragging .pane-table { pointer-events: none; }

  /* tabla ocupa alto y scrollea internamente (uni-body ya hace overflow:auto) */
  .uni-wrap { flex: 1 1 auto; min-height: 0; }
</style>
</head>
<body>
<div class="app">
  <div class="v-head">
    <h1>O.N's · Unificado</h1>
    <span class="sub">— Split redimensionable</span>
    <span class="gen" id="gen"></span>
    <span class="spacer"></span>
    <span class="badge">BYMA open (20m)</span>
    <button class="tbtn" title="Tema claro/oscuro" onclick="ON.toggleTheme()">◐</button>
  </div>

  <div class="split" id="split">
    <!-- IZQUIERDA: tabla -->
    <div class="pane-table" id="paneTable">
      <div id="tool"></div>
    </div>

    <!-- DIVISOR arrastrable -->
    <div class="divider" id="divider" title="Arrastrar para repartir · doble-click resetea 65/35">
      <span class="grip"><i></i><i></i><i></i></span>
    </div>

    <!-- DERECHA: gráfico -->
    <div class="pane-chart" id="paneChart">
      <div class="ph">TIR vs MD · por sector
        <span class="hint">burbuja = sector · radio ∝ nº bonos · click = resaltar</span>
      </div>
      <div class="chart-box"><canvas id="scatter"></canvas></div>
    </div>
  </div>
</div>

<script src="../_shared/on_data.js"></script>
<script src="../_shared/sectors.js"></script>
<script src="../_shared/chart.umd.min.js"></script>
<script src="../_shared/util.js"></script>
<script src="../_shared/unified.js"></script>
<script>
(function () {
  "use strict";

  // ---- subtítulo de snapshot en el header ----
  try {
    var meta = ON.DATA.meta || {};
    var gen = ON.DATA.generated ? ("snapshot " + ON.DATA.generated.replace("T", " ")) : "";
    var info = meta.n_bonds != null ? (meta.n_bonds + " ONs · AR " + meta.n_ar + " / EXT " + meta.n_ext) : "";
    document.getElementById("gen").textContent = [gen, info].filter(Boolean).join("  ·  ");
  } catch (e) {}

  // ============================================================
  //  GRÁFICO: TIR vs MD · por sector (bubble)
  // ============================================================
  var canvas = document.getElementById("scatter");
  var chart = null;
  var lastAggs = [];           // último set de aggs renderizado (para recolorear sin perder datos)
  var activeSector = null;     // sector resaltado (toggle)

  function radius(count) { return Math.max(8, Math.min(28, 6 + count * 1.3)); }

  function toPoints(aggs) {
    return (aggs || [])
      .filter(function (a) { return a.md_avg != null && a.md_avg > 0 && a.tir_avg != null; })
      .map(function (a) {
        return {
          x: a.md_avg, y: a.tir_avg, r: radius(a.count),
          key: a.key, short: a.short, count: a.count,
          color: a.color, tir: a.tir_avg, md: a.md_avg,
        };
      });
  }

  function buildChart() {
    var t = ON.chartTheme();
    var pts = toPoints(lastAggs);
    chart = new window.Chart(canvas.getContext("2d"), {
      type: "bubble",
      data: {
        datasets: [{
          data: pts,
          parsing: false,
          backgroundColor: function (c) { var r = c.raw || {}; return (r.color || t.accent) + "cc"; },
          borderColor: function (c) { var r = c.raw || {}; return r.color || t.accent; },
          borderWidth: 1.5,
          hoverBorderWidth: 2.5,
        }],
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        animation: { duration: 220 },
        onClick: function (ev, els) {
          if (!els || !els.length) return;
          var p = chart.data.datasets[0].data[els[0].index];
          if (!p) return;
          activeSector = (activeSector === p.key) ? null : p.key;
          window.Unified.highlight(activeSector);   // toggle resaltado en la tabla
        },
        onHover: function (ev, els) { canvas.style.cursor = (els && els.length) ? "pointer" : "default"; },
        scales: {
          x: {
            title: { display: true, text: "MD prom (años)", color: t.txt },
            ticks: { color: t.txt }, grid: { color: t.grid }, border: { color: t.grid },
          },
          y: {
            title: { display: true, text: "TIR prom (%)", color: t.txt },
            ticks: { color: t.txt, callback: function (v) { return v + "%"; } },
            grid: { color: t.grid }, border: { color: t.grid },
          },
        },
        plugins: {
          legend: { display: false },
          tooltip: {
            callbacks: {
              label: function (c) {
                var r = c.raw || {};
                return r.short + " (" + r.count + " bonos) · TIR prom " +
                  (r.tir != null ? r.tir.toFixed(2) : "?") + "% · MD prom " +
                  (r.md != null ? r.md.toFixed(2) : "?") + " a";
              },
            },
          },
        },
      },
    });
  }

  // redibuja con los aggs actuales (sigue el filtro de la tabla)
  function drawChart(aggs) {
    if (aggs) lastAggs = aggs;
    if (!chart) { buildChart(); return; }
    chart.data.datasets[0].data = toPoints(lastAggs);
    chart.update("none");
  }

  // recolorea ejes/grilla al cambiar de tema (reconstruye para tomar tokens nuevos)
  function recolor() {
    if (chart) { chart.destroy(); chart = null; }
    buildChart();
  }
  window.addEventListener("on:themechange", recolor);

  // ============================================================
  //  TABLA unificada (la monta unified.js)
  // ============================================================
  window.Unified.render(document.getElementById("tool"), {
    defaultCcy: "MEP",
    onRender: function (bonds, aggs) { drawChart(aggs); },
  });

  // instancia inicial del chart (el canvas ya está en el DOM y visible)
  if (!chart) buildChart();

  // ============================================================
  //  DIVISOR arrastrable (reparte el ancho; mínimos 320px)
  // ============================================================
  var split = document.getElementById("split");
  var divider = document.getElementById("divider");
  var paneTable = document.getElementById("paneTable");
  var paneChart = document.getElementById("paneChart");
  var MIN = 320;
  var DIV_W = 10;          // ancho del divisor (debe coincidir con .divider flex-basis)
  var GAP = 0;
  var ratio = 0.65;        // fracción del ancho para la tabla (default 65/35)

  // aplica el ratio actual respetando los mínimos de cada lado
  function applyRatio(r) {
    var total = split.clientWidth - DIV_W;          // ancho repartible entre los 2 panes
    if (total <= 0) return;
    var minR = MIN / total;
    var maxR = 1 - MIN / total;
    if (minR > maxR) { r = 0.5; }                   // ventana muy chica: parte por la mitad
    else { r = Math.max(minR, Math.min(maxR, r)); }
    ratio = r;
    var tableW = Math.round(total * ratio);
    paneTable.style.flex = "0 0 " + tableW + "px";
    paneTable.style.width = tableW + "px";
    paneChart.style.flex = "1 1 auto";              // el gráfico toma el resto
  }

  function resizeChart() {
    if (chart) chart.resize();
  }

  var dragging = false;
  function onDown(e) {
    dragging = true;
    divider.classList.add("dragging");
    document.body.classList.add("dragging");
    e.preventDefault();
    window.addEventListener("mousemove", onMove);
    window.addEventListener("mouseup", onUp);
  }
  function onMove(e) {
    if (!dragging) return;
    var rect = split.getBoundingClientRect();
    var total = split.clientWidth - DIV_W;
    if (total <= 0) return;
    // posición del mouse relativa al área repartible (centro del divisor bajo el cursor)
    var x = e.clientX - rect.left - DIV_W / 2;
    applyRatio(x / total);
    // resize en vivo es opcional; el requisito es redibujar AL SOLTAR.
    // Chart.js es responsive, pero forzamos un resize barato durante el drag para fluidez.
    resizeChart();
  }
  function onUp() {
    if (!dragging) return;
    dragging = false;
    divider.classList.remove("dragging");
    document.body.classList.remove("dragging");
    window.removeEventListener("mousemove", onMove);
    window.removeEventListener("mouseup", onUp);
    // redibujar/resizear al soltar (requisito de la variante)
    resizeChart();
  }
  divider.addEventListener("mousedown", onDown);

  // doble-click resetea a 65/35
  divider.addEventListener("dblclick", function () {
    applyRatio(0.65);
    resizeChart();
  });

  // reparto inicial + re-aplicar mínimos al cambiar el tamaño de ventana
  function init() { applyRatio(ratio); resizeChart(); }
  if (split.clientWidth > 0) init();
  else requestAnimationFrame(init);   // por si el layout aún no midió

  window.addEventListener("resize", function () { applyRatio(ratio); resizeChart(); });
})();
</script>
</body>
</html>
