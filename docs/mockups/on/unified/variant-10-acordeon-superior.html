<!doctype html>
<html lang="es" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ON Unificado · Acordeón superior</title>
<link rel="stylesheet" href="../_shared/theme.css">
<link rel="stylesheet" href="../_shared/unified.css">
<style>
  /* ---- LAYOUT — variante 10: acordeón superior ---- */
  html, body { height: 100%; }
  .pg { display: flex; flex-direction: column; height: 100vh; min-height: 0; }

  /* header terminal */
  .v-head { flex: 0 0 auto; display: flex; align-items: center; gap: 12px;
    padding: 9px 16px; background: var(--head-bg); color: var(--text-white);
    box-shadow: var(--shadow-panel); z-index: 30; }
  .v-head h1 { margin: 0; font-size: 14px; font-weight: 700; letter-spacing: .4px; white-space: nowrap; }
  .v-head .sub { color: #c7d0ee; font-size: 11.5px; }
  .v-head .gen { color: #8fa0d6; font-size: 10.5px; margin-left: 4px; }
  .v-head .spacer { margin-left: auto; }
  .v-head .tbtn { background: rgba(255,255,255,.12); border: none; color: #fff; cursor: pointer;
    border-radius: 6px; padding: 6px 11px; font-size: 14px; line-height: 1; }
  .v-head .tbtn:hover { background: rgba(255,255,255,.22); }

  /* ---- acordeón ---- */
  .acc { flex: 0 0 auto; background: var(--panel-bg); border-bottom: 1px solid var(--panel-border);
    box-shadow: var(--shadow-panel); position: relative; z-index: 20; }

  /* barra resumen (siempre visible, clickeable) */
  .acc-bar { display: flex; align-items: center; gap: 0; padding: 0 14px; height: 52px;
    cursor: pointer; user-select: none; }
  .acc-bar:hover { background: var(--row-hover); }
  .acc-title { display: flex; align-items: center; gap: 9px; font-weight: 700; font-size: 12.5px;
    letter-spacing: .3px; flex: 0 0 auto; margin-right: 8px; }
  .acc-title .acc-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 28%, transparent); }
  .acc-kpis { display: flex; align-items: center; gap: 0; flex: 1 1 auto; overflow: hidden; }
  .kpi-cell { display: flex; flex-direction: column; justify-content: center; padding: 0 16px;
    border-left: 1px solid var(--panel-border); min-width: 0; }
  .kpi-cell:first-child { border-left: none; }
  .kpi-cell .kl { color: var(--text-faint); font-size: 9.5px; text-transform: uppercase;
    letter-spacing: .4px; font-weight: 700; white-space: nowrap; }
  .kpi-cell .kv { font-family: var(--font-mono); font-variant-numeric: tabular-nums;
    font-size: 17px; font-weight: 700; margin-top: 1px; white-space: nowrap; line-height: 1.1; }
  .kpi-cell .kv small { font-size: 10px; color: var(--text-faint); font-weight: 600; margin-left: 2px; }

  .acc-toggle { flex: 0 0 auto; display: flex; align-items: center; gap: 7px; margin-left: 12px;
    color: var(--text-dim); font-size: 11px; font-weight: 600; white-space: nowrap; }
  .acc-chev { width: 22px; height: 22px; display: grid; place-items: center; border-radius: 6px;
    background: var(--page-bg); border: 1px solid var(--panel-border); color: var(--accent);
    font-size: 12px; transition: transform .28s cubic-bezier(.4,0,.2,1); }
  .acc.open .acc-chev { transform: rotate(180deg); }

  /* panel del gráfico — animación de altura */
  .acc-panel { overflow: hidden; max-height: 0; transition: max-height .34s cubic-bezier(.4,0,.2,1); }
  .acc.open .acc-panel { max-height: 360px; }
  .acc-panel-inner { padding: 8px 14px 16px; border-top: 1px solid var(--panel-border); }
  .acc-chart-head { display: flex; align-items: baseline; gap: 8px; margin: 2px 2px 6px; }
  .acc-chart-head b { font-size: 12px; font-weight: 700; letter-spacing: .3px; }
  .acc-chart-head .hint { color: var(--text-faint); font-size: 10.5px; }
  .acc-canvas-wrap { position: relative; height: 300px; width: 100%; }

  /* tabla — ocupa el resto y scrollea adentro */
  #tool { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column;
    border-top: 1px solid var(--panel-border); }
</style>
</head>
<body>
<div class="pg">

  <header class="v-head">
    <h1>O.N's · Unificado</h1>
    <span class="sub">— Acordeón superior</span>
    <span class="gen" id="genTxt"></span>
    <span class="spacer"></span>
    <button class="tbtn" title="Tema claro/oscuro" onclick="ON.toggleTheme()">◐</button>
  </header>

  <!-- ACORDEÓN: barra resumen (colapsado) + panel del gráfico (expandido) -->
  <section class="acc" id="acc">
    <div class="acc-bar" id="accBar" role="button" aria-expanded="false" tabindex="0">
      <div class="acc-title"><span class="acc-dot"></span>Resumen</div>
      <div class="acc-kpis" id="accKpis">
        <div class="kpi-cell"><span class="kl">ONs visibles</span><span class="kv" id="kpiCount">—</span></div>
        <div class="kpi-cell"><span class="kl">Sectores</span><span class="kv" id="kpiSectors">—</span></div>
        <div class="kpi-cell"><span class="kl">TIR prom</span><span class="kv" id="kpiTir">—</span></div>
        <div class="kpi-cell"><span class="kl">MD prom</span><span class="kv" id="kpiMd">—</span></div>
        <div class="kpi-cell"><span class="kl">Vol total</span><span class="kv" id="kpiVol">—</span></div>
      </div>
      <div class="acc-toggle">
        <span id="accLabel">Ver gráfico</span>
        <span class="acc-chev">▼</span>
      </div>
    </div>
    <div class="acc-panel" id="accPanel">
      <div class="acc-panel-inner">
        <div class="acc-chart-head">
          <b>TIR vs MD · por sector</b>
          <span class="hint">burbuja = sector · radio ∝ nº de bonos · click para resaltar en la tabla</span>
        </div>
        <div class="acc-canvas-wrap"><canvas id="chart"></canvas></div>
      </div>
    </div>
  </section>

  <!-- TABLA unificada -->
  <div id="tool"></div>
</div>

<script src="../_shared/on_data.js"></script>
<script src="../_shared/sectors.js"></script>
<script src="../_shared/chart.umd.min.js"></script>
<script src="../_shared/util.js"></script>
<script src="../_shared/unified.js"></script>
<script>
(function () {
  "use strict";

  // snapshot en el header
  try {
    var g = ON.DATA && ON.DATA.generated;
    document.getElementById("genTxt").textContent = g ? ("snapshot " + g.replace("T", " ")) : "";
  } catch (e) {}

  // ---- estado del gráfico ----
  var chart = null, lastAggs = [];
  var canvas = document.getElementById("chart");

  function bubbleR(count) { return Math.max(8, Math.min(28, 6 + count * 1.3)); }

  function buildData(aggs) {
    return aggs
      .filter(function (a) { return a.md_avg != null && a.tir_avg != null; })
      .map(function (a) {
        return {
          x: a.md_avg, y: a.tir_avg, r: bubbleR(a.count),
          _sec: a.key, _short: a.short, _count: a.count,
          _color: a.color || ON.sectorColor(a.key),
        };
      });
  }

  function makeOpts() {
    var t = ON.chartTheme();
    return {
      responsive: true, maintainAspectRatio: false,
      animation: { duration: 320 },
      onClick: function (evt, els) {
        if (!els || !els.length) return;
        var d = chart.data.datasets[0].data[els[0].index];
        if (d && d._sec) Unified.highlight(currentHl === d._sec ? (currentHl = null) : (currentHl = d._sec));
      },
      scales: {
        x: {
          title: { display: true, text: "MD prom (años)", color: t.txt },
          ticks: { color: t.txt }, grid: { color: t.grid },
          border: { color: t.grid },
        },
        y: {
          title: { display: true, text: "TIR prom (%)", color: t.txt },
          ticks: { color: t.txt, callback: function (v) { return v + "%"; } },
          grid: { color: t.grid }, border: { color: t.grid },
        },
      },
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: {
            label: function (c) {
              var r = c.raw || {};
              return r._short + " (" + r._count + " bonos) · TIR prom " +
                (r.y != null ? r.y.toFixed(1) : "?") + "% · MD prom " +
                (r.x != null ? r.x.toFixed(1) : "?") + " a";
            },
          },
        },
      },
    };
  }

  function styleData(data) {
    return {
      datasets: [{
        data: data,
        backgroundColor: data.map(function (d) { return d._color + "cc"; }),
        borderColor: data.map(function (d) { return d._color; }),
        borderWidth: 2,
        hoverBorderWidth: 3,
      }],
    };
  }

  function ensureChart() {
    if (chart) return;
    chart = new window.Chart(canvas.getContext("2d"), {
      type: "bubble",
      data: styleData(buildData(lastAggs)),
      options: makeOpts(),
    });
  }

  function drawChart(aggs) {
    lastAggs = aggs || lastAggs || [];
    ensureChart();
    var data = buildData(lastAggs);
    chart.data = styleData(data);
    chart.update();
  }

  function recolor() {
    if (!chart) return;
    chart.options = makeOpts();
    chart.data = styleData(buildData(lastAggs));
    chart.update();
  }

  var currentHl = null;

  // crear la instancia de Chart al cargar (canvas ya en el DOM, contenedor colapsado)
  lastAggs = (Unified.sectorAggs && Unified.sectorAggs()) || [];
  ensureChart();

  // recolorear/redibujar al cambio de tema
  window.addEventListener("on:themechange", recolor);

  // ---- acordeón: abrir/cerrar ----
  var acc = document.getElementById("acc");
  var accBar = document.getElementById("accBar");
  var accLabel = document.getElementById("accLabel");
  function setOpen(open) {
    acc.classList.toggle("open", open);
    accBar.setAttribute("aria-expanded", open ? "true" : "false");
    accLabel.textContent = open ? "Ocultar gráfico" : "Ver gráfico";
    if (open) {
      // el canvas estuvo en un contenedor con max-height:0 → re-medir tras la transición
      requestAnimationFrame(function () { if (chart) chart.resize(); });
      setTimeout(function () { if (chart) chart.resize(); }, 360);
    }
  }
  accBar.addEventListener("click", function () { setOpen(!acc.classList.contains("open")); });
  accBar.addEventListener("keydown", function (e) {
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); setOpen(!acc.classList.contains("open")); }
  });

  // ---- KPIs del resumen (de los aggs visibles) ----
  function updateKpis(bonds, aggs) {
    var count = bonds.length;
    var sectors = aggs.length;
    var tir = ON.avg(bonds.map(function (b) { return b.tir; }));
    var md = ON.avg(bonds.map(function (b) { return b.md; }));
    var volTot = ON.sum(bonds.map(function (b) { return b.volume || 0; }));
    document.getElementById("kpiCount").textContent = count;
    document.getElementById("kpiSectors").textContent = sectors;
    document.getElementById("kpiTir").innerHTML = (tir != null ? tir.toFixed(1) : "—") + "<small>%</small>";
    document.getElementById("kpiMd").innerHTML = (md != null ? md.toFixed(1) : "—") + "<small>a</small>";
    document.getElementById("kpiVol").textContent = ON.vol(volTot);
  }

  // ---- montar la tabla; redibujar el gráfico + KPIs en cada render ----
  Unified.render(document.getElementById("tool"), {
    defaultCcy: "MEP",
    onRender: function (bonds, aggs) {
      updateKpis(bonds, aggs);
      drawChart(aggs);
      // si el sector resaltado desapareció del filtro, limpiar
      if (currentHl && !aggs.some(function (a) { return a.key === currentHl; })) {
        currentHl = null; Unified.highlight(null);
      }
    },
  });
})();
</script>
</body>
</html>
