<!doctype html>
<html lang="es" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ON Unificado · Dock inferior fijo</title>
<link rel="stylesheet" href="../_shared/theme.css">
<link rel="stylesheet" href="../_shared/unified.css">
<style>
  /* ---- LAYOUT: shell a 100vh, tabla flex:1 arriba, dock fijo abajo ---- */
  html, body { height: 100%; margin: 0; }
  .shell { display: flex; flex-direction: column; height: 100vh; min-height: 0; }

  /* header terminal */
  .v-head { display: flex; align-items: center; gap: 12px; padding: 0 14px;
    height: 42px; flex: 0 0 42px; background: var(--head-bg); color: var(--text-white);
    box-shadow: var(--shadow-panel); z-index: 30; }
  .v-head h1 { font-size: 13.5px; margin: 0; font-weight: 700; letter-spacing: .4px; white-space: nowrap; }
  .v-head .sub { color: #c7d0ee; font-size: 11px; }
  .v-head .gen { color: #8fa0d6; font-size: 10.5px; margin-left: 4px; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; }
  .v-head .spacer { margin-left: auto; }
  .v-head .badge { background: #e8843a; color: #311; font-weight: 700; font-size: 10px;
    padding: 2px 7px; border-radius: 10px; }
  .v-head .tbtn { background: rgba(255,255,255,.12); border: none; color: #fff; cursor: pointer;
    border-radius: 6px; padding: 5px 10px; font-size: 14px; line-height: 1; }
  .v-head .tbtn:hover { background: rgba(255,255,255,.22); }

  /* tabla: ocupa el alto restante y scrollea internamente (unified.js mete su propio scroll) */
  #tool { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column;
    background: var(--panel-bg); }

  /* ---- DOCK inferior fijo ---- */
  .dock { flex: 0 0 240px; height: 240px; background: var(--panel-bg);
    border-top: 1px solid var(--panel-border); box-shadow: 0 -4px 14px rgba(10,29,74,.10);
    display: flex; flex-direction: column; overflow: hidden;
    transition: height .28s cubic-bezier(.4,0,.2,1), flex-basis .28s cubic-bezier(.4,0,.2,1); }
  [data-theme="dark"] .dock { box-shadow: 0 -4px 14px rgba(0,0,0,.5); }
  .dock.min { flex: 0 0 28px; height: 28px; }

  .dock-bar { display: flex; align-items: center; gap: 10px; height: 28px; flex: 0 0 28px;
    padding: 0 12px; background: var(--navy-band); color: #fff; cursor: pointer;
    user-select: none; }
  .dock-bar .dk-title { font-weight: 700; font-size: 11.5px; letter-spacing: .3px; }
  .dock-bar .dk-hint { color: #c7d0ee; font-size: 10.5px; font-weight: 500; }
  .dock-bar .dk-spacer { margin-left: auto; }
  .dock-bar .dk-chip { font-family: var(--font-mono); font-size: 10px; font-weight: 700;
    color: #c7d0ee; background: rgba(255,255,255,.10); padding: 1px 7px; border-radius: 9px; }
  .dock-toggle { background: rgba(255,255,255,.14); border: none; color: #fff; cursor: pointer;
    border-radius: 5px; width: 22px; height: 18px; font-size: 11px; line-height: 1; padding: 0;
    display: inline-flex; align-items: center; justify-content: center; }
  .dock-toggle:hover { background: rgba(255,255,255,.28); }

  /* zona del gráfico apaisado, llena el dock; maintainAspectRatio:false */
  .dock-chart { flex: 1 1 auto; min-height: 0; position: relative; padding: 8px 12px 10px; }
  .dock.min .dock-chart { display: none; }
  #chart { width: 100% !important; height: 100% !important; display: block; }
</style>
</head>
<body>
<div class="shell">
  <header class="v-head">
    <h1>O.N's · Unificado</h1>
    <span class="sub">— Dock inferior fijo</span>
    <span class="gen" id="genLine"></span>
    <span class="spacer"></span>
    <span class="badge">BYMA open (20m)</span>
    <button class="tbtn" title="Tema claro/oscuro" onclick="ON.toggleTheme()">◐</button>
  </header>

  <!-- tabla unificada (Unified.render monta acá) -->
  <div id="tool"></div>

  <!-- DOCK inferior fijo con el gráfico apaisado -->
  <section class="dock" id="dock">
    <div class="dock-bar" id="dockBar" title="Minimizar / restaurar">
      <span class="dk-title">TIR vs MD · por sector</span>
      <span class="dk-hint">scatter — burbuja por sector · click para resaltar</span>
      <span class="dk-spacer"></span>
      <span class="dk-chip" id="dockChip">—</span>
      <button class="dock-toggle" id="dockToggle" title="Minimizar dock">▾</button>
    </div>
    <div class="dock-chart">
      <canvas id="chart"></canvas>
    </div>
  </section>
</div>

<script src="../_shared/on_data.js"></script>
<script src="../_shared/sectors.js"></script>
<script src="../_shared/chart.umd.min.js"></script>
<script src="../_shared/util.js"></script>
<script src="../_shared/unified.js"></script>
<script>
(function () {
  "use strict";

  // línea de snapshot en el header
  var D = ON.DATA;
  var genEl = document.getElementById("genLine");
  if (genEl) {
    var gen = D.generated ? ("snapshot " + D.generated.replace("T", " ")) : "";
    var meta = D.meta ? (D.meta.n_bonds + " ONs · AR " + D.meta.n_ar + " / EXT " + D.meta.n_ext) : "";
    genEl.textContent = [gen, meta].filter(Boolean).join("  ·  ");
  }

  // ---- estado del gráfico ----
  var chart = null;
  var lastAggs = [];
  var activeSector = null;   // sector resaltado (toggle)

  function radius(count) { return Math.max(8, Math.min(28, 6 + count * 1.3)); }

  // datasets: una burbuja POR SECTOR (x=md_avg, y=tir_avg, r∝count)
  function buildData(aggs) {
    var pts = (aggs || [])
      .filter(function (a) { return a.md_avg != null && a.tir_avg != null && a.count > 0; })
      .map(function (a) {
        return {
          x: a.md_avg, y: a.tir_avg, r: radius(a.count),
          key: a.key, short: a.short, count: a.count, color: a.color,
        };
      });
    return {
      datasets: [{
        data: pts,
        parsing: false,
        pointStyle: "circle",
        backgroundColor: pts.map(function (p) { return p.color + "cc"; }),
        borderColor: pts.map(function (p) { return p.color; }),
        borderWidth: 1.5,
        hoverBorderWidth: 2.5,
      }],
    };
  }

  function chartOptions() {
    var t = ON.chartTheme();
    return {
      responsive: true,
      maintainAspectRatio: false,   // apaisado: llena el dock
      animation: { duration: 220 },
      layout: { padding: { top: 6, right: 12, bottom: 2, left: 2 } },
      scales: {
        x: {
          title: { display: true, text: "MD prom (años)", color: t.txt, font: { size: 11 } },
          ticks: { color: t.txt, font: { size: 10 } },
          grid: { color: t.grid },
          border: { color: t.grid },
          beginAtZero: true,
        },
        y: {
          title: { display: true, text: "TIR prom (%)", color: t.txt, font: { size: 11 } },
          ticks: { color: t.txt, font: { size: 10 } },
          grid: { color: t.grid },
          border: { color: t.grid },
        },
      },
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: {
            label: function (c) {
              var p = c.raw || {};
              return p.short + " (" + p.count + " bonos) · TIR prom " +
                (p.y != null ? p.y.toFixed(2) : "?") + "% · MD prom " +
                (p.x != null ? p.x.toFixed(2) : "?") + " a";
            },
          },
        },
      },
      onClick: function (evt, els) {
        if (!els || !els.length) return;
        var p = chart.data.datasets[0].data[els[0].index];
        if (!p) return;
        activeSector = (activeSector === p.key) ? null : p.key;
        Unified.highlight(activeSector);   // toggle del resaltado en la tabla
      },
      onHover: function (evt, els) {
        evt.native && (evt.native.target.style.cursor = (els && els.length) ? "pointer" : "default");
      },
    };
  }

  // atenúa los sectores no-activos también en el gráfico (espejo del highlight de la tabla)
  function applyEmphasis() {
    if (!chart) return;
    var ds = chart.data.datasets[0];
    var data = ds.data;
    ds.backgroundColor = data.map(function (p) {
      if (!activeSector) return p.color + "cc";
      return p.key === activeSector ? p.color + "ee" : p.color + "33";
    });
    ds.borderColor = data.map(function (p) {
      if (!activeSector) return p.color;
      return p.key === activeSector ? p.color : p.color + "55";
    });
  }

  function draw(aggs) {
    lastAggs = aggs || lastAggs || [];
    var chipEl = document.getElementById("dockChip");
    if (chipEl) {
      var nSec = lastAggs.filter(function (a) { return a.md_avg != null && a.tir_avg != null && a.count > 0; }).length;
      chipEl.textContent = nSec + " sectores";
    }
    if (!chart) {
      chart = new Chart(document.getElementById("chart").getContext("2d"), {
        type: "bubble",
        data: buildData(lastAggs),
        options: chartOptions(),
      });
      applyEmphasis();
      chart.update("none");
      return;
    }
    chart.data = buildData(lastAggs);
    applyEmphasis();
    chart.update();
  }

  // recolorear/redibujar con el tema (ejes/grilla/colores)
  function retheme() {
    if (!chart) return;
    chart.options = chartOptions();
    applyEmphasis();
    chart.update("none");
  }

  // ---- dock minimizar / restaurar (arranca ABIERTO) ----
  var dock = document.getElementById("dock");
  var dockToggle = document.getElementById("dockToggle");
  var dockBar = document.getElementById("dockBar");

  function setMin(min) {
    dock.classList.toggle("min", min);
    dockToggle.textContent = min ? "▴" : "▾";
    dockToggle.title = min ? "Restaurar dock" : "Minimizar dock";
    // tras la transición de tamaño, Chart re-mide su contenedor
    if (!min) setTimeout(function () { chart && chart.resize(); }, 300);
  }
  function toggleDock() { setMin(!dock.classList.contains("min")); }

  dockToggle.addEventListener("click", function (e) { e.stopPropagation(); toggleDock(); });
  dockBar.addEventListener("click", toggleDock);   // toda la barra colapsa/restaura

  // re-medir el gráfico cuando cambia el viewport
  window.addEventListener("resize", function () { chart && !dock.classList.contains("min") && chart.resize(); });
  window.addEventListener("on:themechange", retheme);

  // ---- montar la tabla; redibujar el gráfico en cada (re)render para seguir el filtro ----
  Unified.render(document.getElementById("tool"), {
    defaultCcy: "MEP",
    onRender: function (bonds, aggs) { draw(aggs); },
  });

  // primer dibujo garantizado (aunque onRender ya corrió en el render inicial)
  draw(Unified.sectorAggs());
})();
</script>
</body>
</html>
