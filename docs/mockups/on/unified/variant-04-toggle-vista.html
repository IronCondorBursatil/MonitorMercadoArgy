<!doctype html>
<html lang="es" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ON Unificado · Toggle Tabla | Gráfico | Ambos</title>
<link rel="stylesheet" href="../_shared/theme.css">
<link rel="stylesheet" href="../_shared/unified.css">
<style>
  /* ---- LAYOUT variante 04 — Toggle Tabla | Gráfico | Ambos ---- */
  html, body { height: 100%; margin: 0; }
  .pg { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

  /* header terminal */
  .v-head { display: flex; align-items: center; gap: 14px; padding: 9px 16px;
    background: var(--head-bg); color: #fff; box-shadow: var(--shadow-panel);
    flex: 0 0 auto; z-index: 50; }
  .v-head h1 { font-size: 13.5px; margin: 0; font-weight: 700; letter-spacing: .5px;
    white-space: nowrap; }
  .v-head .gen { color: #8fa0d6; font-size: 10.5px; white-space: nowrap; }
  .v-head .spacer { margin-left: auto; }
  .v-head .badge { background: #e8843a; color: #311; font-weight: 700; font-size: 10px;
    padding: 2px 7px; border-radius: 10px; }
  .v-head .tbtn { background: rgba(255,255,255,.12); border: none; color: #fff; cursor: pointer;
    border-radius: 6px; padding: 5px 10px; font-size: 14px; line-height: 1; }
  .v-head .tbtn:hover { background: rgba(255,255,255,.22); }

  /* segmented control (Tabla | Gráfico | Ambos) */
  .v-seg { display: inline-flex; border: 1px solid rgba(255,255,255,.22); border-radius: 8px;
    overflow: hidden; background: rgba(255,255,255,.05); }
  .v-seg button { background: transparent; color: #c7d0ee; border: none; cursor: pointer;
    padding: 6px 14px; font: 600 11.5px var(--font-body); display: inline-flex; align-items: center;
    gap: 6px; transition: background .15s, color .15s; }
  .v-seg button + button { border-left: 1px solid rgba(255,255,255,.18); }
  .v-seg button .ico { font-size: 12px; opacity: .85; }
  .v-seg button:hover { background: rgba(255,255,255,.10); color: #fff; }
  .v-seg button.on { background: var(--accent); color: #fff; }

  /* zona de contenido — alterna entre layouts */
  .v-content { flex: 1 1 auto; min-height: 0; display: flex; gap: 12px; padding: 12px;
    background: var(--page-bg); }

  /* contenedor de la tabla */
  .v-tablewrap { flex: 1 1 auto; min-width: 0; min-height: 0; display: flex; flex-direction: column;
    background: var(--panel-bg); border: 1px solid var(--panel-border); border-radius: var(--radius);
    box-shadow: var(--shadow-panel); overflow: hidden; transition: flex-basis .25s ease; }
  #tool { flex: 1 1 auto; min-height: 0; }

  /* contenedor del gráfico */
  .v-chartwrap { flex: 0 0 auto; min-height: 0; display: flex; flex-direction: column;
    background: var(--panel-bg); border: 1px solid var(--panel-border); border-radius: var(--radius);
    box-shadow: var(--shadow-panel); overflow: hidden; transition: flex-basis .25s ease; }
  .v-chart-head { display: flex; align-items: center; gap: 8px; padding: 8px 14px;
    background: var(--navy-band); color: #fff; font-weight: 700; font-size: 12px; letter-spacing: .3px;
    flex: 0 0 auto; }
  .v-chart-head .hint { margin-left: auto; font-weight: 500; font-size: 10px; color: #b9c4ea;
    letter-spacing: 0; }
  .v-chart-body { flex: 1 1 auto; min-height: 0; position: relative; padding: 10px 12px 12px; }
  .v-chart-body canvas { position: absolute; inset: 10px 12px 12px; }

  /* ---- modos (controlados por data-view en .v-content) ---- */
  /* DEFAULT = tabla: gráfico oculto, tabla full */
  .v-content[data-view="tabla"]  .v-chartwrap { display: none; }
  .v-content[data-view="tabla"]  .v-tablewrap { flex: 1 1 100%; }

  /* gráfico solo: tabla oculta, gráfico grande y centrado */
  .v-content[data-view="grafico"] .v-tablewrap { display: none; }
  .v-content[data-view="grafico"] .v-chartwrap { flex: 1 1 100%; align-items: stretch; }
  .v-content[data-view="grafico"] .v-chart-body { min-height: 0; }

  /* ambos: tabla + gráfico lado a lado 60/40 */
  .v-content[data-view="ambos"] .v-tablewrap { flex: 1 1 60%; }
  .v-content[data-view="ambos"] .v-chartwrap { flex: 1 1 40%; max-width: 40%; }

  /* en grafico/ambos el gráfico vive a la derecha; en grafico ocupa el ancho */
  .v-empty { color: var(--text-faint); font-size: 11.5px; text-align: center; padding: 20px; }

  @media (max-width: 860px) {
    .v-content[data-view="ambos"] { flex-direction: column; }
    .v-content[data-view="ambos"] .v-chartwrap { max-width: none; flex: 1 1 40%; }
  }
</style>
</head>
<body>
<div class="pg">
  <header class="v-head">
    <h1>O.N's · Unificado — Toggle Tabla | Gráfico | Ambos</h1>
    <span class="gen" id="genInfo"></span>
    <span class="spacer"></span>
    <div class="v-seg" id="viewSeg">
      <button data-view="tabla" class="on"><span class="ico">▤</span>Tabla</button>
      <button data-view="grafico"><span class="ico">◌</span>Gráfico</button>
      <button data-view="ambos"><span class="ico">◫</span>Ambos</button>
    </div>
    <span class="badge">BYMA open (20m)</span>
    <button class="tbtn" title="Tema claro/oscuro" onclick="ON.toggleTheme()">◐</button>
  </header>

  <div class="v-content" id="content" data-view="tabla">
    <div class="v-tablewrap">
      <div id="tool"></div>
    </div>
    <div class="v-chartwrap">
      <div class="v-chart-head">
        TIR vs MD · por sector
        <span class="hint" id="chartHint">click en burbuja = resaltar sector</span>
      </div>
      <div class="v-chart-body">
        <canvas id="scatter"></canvas>
      </div>
    </div>
  </div>
</div>

<script src="../_shared/on_data.js"></script>
<script src="../_shared/sectors.js"></script>
<script src="../_shared/chart.umd.min.js"></script>
<script src="../_shared/util.js"></script>
<script src="../_shared/unified.js"></script>
<script>
(function () {
  "use strict";

  // ---- info de snapshot en el header ----
  var D = window.ON_DATA || {};
  var gen = D.generated ? ("snapshot " + D.generated.replace("T", " ")) : "";
  var metaTxt = D.meta ? (D.meta.n_bonds + " ONs · AR " + D.meta.n_ar + " / EXT " + D.meta.n_ext) : "";
  document.getElementById("genInfo").textContent = [gen, metaTxt].filter(Boolean).join("  ·  ");

  // ---- estado del gráfico ----
  var canvas = document.getElementById("scatter");
  var chart = null;
  var lastAggs = [];
  var selectedSector = null;   // toggle de highlight

  function radius(count) { return Math.max(8, Math.min(28, 6 + count * 1.3)); }

  // construir el dataset de burbujas desde los aggs (una por sector con MD y TIR válidos)
  function bubbles(aggs) {
    return aggs.filter(function (a) {
      return a.md_avg != null && !isNaN(a.md_avg) && a.tir_avg != null && !isNaN(a.tir_avg);
    }).map(function (a) {
      return {
        x: a.md_avg, y: a.tir_avg, r: radius(a.count),
        key: a.key, short: a.short, count: a.count, color: a.color,
      };
    });
  }

  function buildOptions() {
    var t = ON.chartTheme();
    return {
      responsive: true, maintainAspectRatio: false,
      animation: { duration: 250 },
      onClick: function (ev, elements) {
        if (!elements || !elements.length) return;
        var raw = elements[0].element.$context.raw;
        if (!raw || !raw.key) return;
        selectedSector = (selectedSector === raw.key) ? null : raw.key;
        Unified.highlight(selectedSector);   // toggle de atenuado en la tabla
      },
      scales: {
        x: {
          title: { display: true, text: "MD prom (años)", color: t.txt, font: { size: 11 } },
          ticks: { color: t.txt }, grid: { color: t.grid },
          border: { color: t.grid },
        },
        y: {
          title: { display: true, text: "TIR prom (%)", color: t.txt, font: { size: 11 } },
          ticks: { color: t.txt, callback: function (v) { return v + "%"; } },
          grid: { color: t.grid },
          border: { color: t.grid },
        },
      },
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: t.panel,
          titleColor: t.accent,
          bodyColor: t.txt,
          borderColor: t.grid,
          borderWidth: 1,
          padding: 9,
          callbacks: {
            title: function () { return ""; },
            label: function (c) {
              var r = c.raw || {};
              return r.short + " (" + r.count + " bonos) · TIR prom " +
                ON.pct(r.y) + " · MD prom " + ON.num(r.x, 2) + " a";
            },
          },
        },
      },
    };
  }

  function buildData(aggs) {
    var pts = bubbles(aggs);
    return {
      datasets: [{
        label: "Sectores",
        data: pts,
        parsing: false,
        backgroundColor: pts.map(function (p) { return p.color + "cc"; }),
        borderColor: pts.map(function (p) { return p.color; }),
        borderWidth: 2,
        hoverBorderWidth: 3,
      }],
    };
  }

  function createChart(aggs) {
    chart = new window.Chart(canvas.getContext("2d"), {
      type: "bubble",
      data: buildData(aggs),
      options: buildOptions(),
    });
  }

  // redibuja con los aggs actuales (sigue el filtro de la tabla)
  function draw(aggs) {
    lastAggs = aggs || lastAggs;
    if (!chart) { createChart(lastAggs); return; }
    chart.data = buildData(lastAggs);
    chart.update();
  }

  // recolorear ejes/grilla y burbujas al cambiar de tema
  function recolor() {
    if (!chart) return;
    chart.options = buildOptions();
    chart.data = buildData(lastAggs);
    chart.update();
  }
  window.addEventListener("on:themechange", recolor);

  // ---- montar la herramienta unificada; redibujar el gráfico en cada onRender ----
  Unified.render(document.getElementById("tool"), {
    defaultCcy: "MEP",
    onRender: function (bonds, aggs) {
      // si el sector resaltado desapareció del filtro, limpiar
      if (selectedSector && !aggs.some(function (a) { return a.key === selectedSector; })) {
        selectedSector = null;
      }
      draw(aggs);
    },
  });

  // crear la instancia de Chart al cargar (el canvas existe siempre en el DOM,
  // aunque su contenedor arranque oculto en el modo "Tabla")
  if (!chart) draw(Unified.sectorAggs());

  // ---- control segmentado: alterna mostrando/ocultando contenedores ----
  var content = document.getElementById("content");
  var seg = document.getElementById("viewSeg");
  seg.querySelectorAll("button").forEach(function (btn) {
    btn.onclick = function () {
      seg.querySelectorAll("button").forEach(function (b) { b.classList.toggle("on", b === btn); });
      content.setAttribute("data-view", btn.dataset.view);
      // el contenedor pudo pasar de display:none a visible → reflow del chart
      if (chart) requestAnimationFrame(function () { chart.resize(); });
    };
  });
})();
</script>
</body>
</html>
