<!doctype html>
<html lang="es" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ON Unificado · Ventana flotante (widget) draggable</title>
<link rel="stylesheet" href="../_shared/theme.css">
<link rel="stylesheet" href="../_shared/unified.css">
<style>
  /* ---- LAYOUT variante 09 — tabla full + widget flotante draggable ---- */
  html, body { height: 100%; margin: 0; }
  .pg { display: flex; flex-direction: column; height: 100vh; }

  /* header terminal */
  .v9-head { display: flex; align-items: center; gap: 12px; padding: 9px 16px;
    background: var(--head-bg); color: #fff; box-shadow: var(--shadow-panel);
    z-index: 50; flex: 0 0 auto; }
  .v9-head h1 { font-size: 14px; margin: 0; font-weight: 700; letter-spacing: .5px; white-space: nowrap; }
  .v9-head .sub { color: #c7d0ee; font-size: 11.5px; font-weight: 600; }
  .v9-head .gen { color: #8fa0d6; font-size: 10.5px; margin-left: 6px; }
  .v9-head .spacer { margin-left: auto; }
  .v9-head .badge { background: #e8843a; color: #311; font-weight: 700; font-size: 10.5px;
    padding: 2px 7px; border-radius: 10px; }
  .v9-head .tbtn { background: rgba(255,255,255,.12); border: none; color: #fff; cursor: pointer;
    border-radius: 6px; padding: 5px 10px; font-size: 13px; line-height: 1; }
  .v9-head .tbtn:hover { background: rgba(255,255,255,.22); }

  /* la tabla ocupa todo y scrollea internamente */
  #tool { flex: 1 1 auto; min-height: 0; }

  /* ---- widget flotante ---- */
  .v9-widget { position: fixed; width: 360px; height: 300px; z-index: 200;
    background: var(--panel-bg); border: 1px solid var(--panel-border); border-radius: 10px;
    box-shadow: 0 10px 34px rgba(0,0,0,.42), var(--shadow-panel);
    display: flex; flex-direction: column; overflow: hidden;
    transition: height .22s cubic-bezier(.4,0,.2,1), box-shadow .18s, opacity .18s; }
  .v9-widget.dragging { transition: none; box-shadow: 0 16px 48px rgba(0,0,0,.55); }

  .v9-wtitle { display: flex; align-items: center; gap: 8px; padding: 7px 8px 7px 11px;
    background: var(--navy-band); color: #fff; cursor: grab; user-select: none;
    font-weight: 700; font-size: 11.5px; letter-spacing: .3px; flex: 0 0 auto; }
  .v9-wtitle:active { cursor: grabbing; }
  .v9-wtitle .grip { color: rgba(255,255,255,.45); font-size: 12px; letter-spacing: 1px; cursor: grab; }
  .v9-wtitle .ttl { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .v9-wtitle .cnt { color: #b9c6ee; font-weight: 600; font-size: 10px; }
  .v9-wtitle .wbtns { margin-left: auto; display: flex; gap: 4px; }
  .v9-wtitle .wbtn { background: rgba(255,255,255,.12); border: none; color: #fff; cursor: pointer;
    width: 22px; height: 20px; border-radius: 5px; font-size: 13px; line-height: 1; padding: 0;
    display: inline-flex; align-items: center; justify-content: center; }
  .v9-wtitle .wbtn:hover { background: rgba(255,255,255,.26); }

  .v9-wbody { flex: 1 1 auto; min-height: 0; position: relative; padding: 8px 8px 6px; }
  .v9-wbody canvas { display: block; width: 100% !important; height: 100% !important; }

  /* minimizado: colapsa a la barra de título */
  .v9-widget.min { height: 34px !important; }
  .v9-widget.min .v9-wbody { display: none; }

  /* botón flotante para re-mostrar si se cierra del todo (no se usa por defecto) */
  .v9-hint { color: var(--text-faint); font-size: 10px; }
</style>
</head>
<body>
<div class="pg">
  <header class="v9-head">
    <h1>O.N's · Unificado</h1>
    <span class="sub">— Ventana flotante (widget) draggable</span>
    <span class="gen" id="v9gen"></span>
    <span class="spacer"></span>
    <span class="badge">BYMA open (20m)</span>
    <button class="tbtn" title="Tema claro/oscuro" onclick="ON.toggleTheme()">◐</button>
  </header>

  <div id="tool"></div>
</div>

<!-- widget flotante (canvas existe desde el inicio) -->
<div class="v9-widget" id="v9widget">
  <div class="v9-wtitle" id="v9title">
    <span class="grip">⋮⋮</span>
    <span class="ttl">TIR vs MD · por sector</span>
    <span class="cnt" id="v9cnt"></span>
    <span class="wbtns">
      <button class="wbtn" id="v9min" title="Minimizar / restaurar">▁</button>
    </span>
  </div>
  <div class="v9-wbody">
    <canvas id="v9chart"></canvas>
  </div>
</div>

<script src="../_shared/on_data.js"></script>
<script src="../_shared/sectors.js"></script>
<script src="../_shared/chart.umd.min.js"></script>
<script src="../_shared/util.js"></script>
<script src="../_shared/unified.js"></script>
<script>
(function () {
  "use strict";

  // gen / snapshot en el header
  var gen = ON.DATA.generated ? ("snapshot " + ON.DATA.generated.replace("T", " ")) : "";
  var metaTxt = ON.DATA.meta ? (ON.DATA.meta.n_bonds + " ONs · AR " + ON.DATA.meta.n_ar + " / EXT " + ON.DATA.meta.n_ext) : "";
  document.getElementById("v9gen").textContent = [gen, metaTxt].filter(Boolean).join("  ·  ");

  // ---------------------------------------------------------------------
  // GRÁFICO: TIR vs MD · por sector (bubble por sector, idéntico en las 10)
  // ---------------------------------------------------------------------
  var canvas = document.getElementById("v9chart");
  var chart = null;
  var lastAggs = [];

  function bubbleData(aggs) {
    return aggs
      .filter(function (a) { return a.md_avg != null && a.tir_avg != null && a.count > 0; })
      .map(function (a) {
        return {
          x: a.md_avg, y: a.tir_avg,
          r: Math.max(8, Math.min(28, 6 + a.count * 1.3)),
          key: a.key, short: a.short, count: a.count, color: a.color,
        };
      });
  }

  function chartOpts() {
    var t = ON.chartTheme();
    return {
      responsive: true, maintainAspectRatio: false,
      animation: { duration: 240 },
      onClick: function (evt, els) {
        if (els && els.length) {
          var d = chart.data.datasets[0].data[els[0].index];
          if (d && d.key) {
            highlighted = (highlighted === d.key) ? null : d.key;
            Unified.highlight(highlighted);
          }
        }
      },
      scales: {
        x: { title: { display: true, text: "MD prom (años)", color: t.txt, font: { size: 10 } },
             ticks: { color: t.txt, font: { size: 9 } }, grid: { color: t.grid } },
        y: { title: { display: true, text: "TIR prom (%)", color: t.txt, font: { size: 10 } },
             ticks: { color: t.txt, font: { size: 9 } }, grid: { color: t.grid } },
      },
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: {
            label: function (c) {
              var r = c.raw || {};
              return r.short + " (" + r.count + " bonos) · TIR prom " +
                (r.y != null ? r.y.toFixed(1) : "?") + "% · MD prom " +
                (r.x != null ? r.x.toFixed(1) : "?") + " a";
            },
          },
        },
      },
    };
  }

  var highlighted = null;

  function styleArrays(data) {
    return {
      bg: data.map(function (d) { return d.color + "cc"; }),
      bd: data.map(function (d) { return d.color; }),
    };
  }

  function draw(aggs) {
    lastAggs = aggs || lastAggs || [];
    var data = bubbleData(lastAggs);
    var st = styleArrays(data);

    // contador en la barra de título
    var nBonds = lastAggs.reduce(function (s, a) { return s + (a.count || 0); }, 0);
    document.getElementById("v9cnt").textContent = "· " + data.length + " sectores / " + nBonds + " bonos";

    if (!chart) {
      chart = new Chart(canvas.getContext("2d"), {
        type: "bubble",
        data: { datasets: [{
          data: data,
          backgroundColor: st.bg, borderColor: st.bd, borderWidth: 1.5,
          hoverBorderWidth: 2.5,
        }] },
        options: chartOpts(),
      });
    } else {
      chart.data.datasets[0].data = data;
      chart.data.datasets[0].backgroundColor = st.bg;
      chart.data.datasets[0].borderColor = st.bd;
      chart.update();
    }
  }

  function recolor() {
    if (!chart) return;
    chart.options = chartOpts();
    var data = chart.data.datasets[0].data;
    var st = styleArrays(data);
    chart.data.datasets[0].backgroundColor = st.bg;
    chart.data.datasets[0].borderColor = st.bd;
    chart.update();
  }

  window.addEventListener("on:themechange", recolor);

  // ---------------------------------------------------------------------
  // Montaje de la herramienta unificada — redibuja el chart en cada render
  // ---------------------------------------------------------------------
  Unified.render(document.getElementById("tool"), {
    defaultCcy: "MEP",
    onRender: function (bonds, aggs) { draw(aggs); },
  });

  // primer dibujo por si onRender no corrió aún (canvas debe existir/instanciarse al cargar)
  if (!chart) draw(Unified.sectorAggs());

  // ---------------------------------------------------------------------
  // WIDGET: drag por la barra de título + minimizar/restaurar + clamp viewport
  // ---------------------------------------------------------------------
  var widget = document.getElementById("v9widget");
  var titleBar = document.getElementById("v9title");
  var minBtn = document.getElementById("v9min");
  var MARGIN = 16;

  function widgetW() { return widget.offsetWidth; }
  function widgetH() { return widget.offsetHeight; }

  function clamp(left, top) {
    var maxL = Math.max(MARGIN, window.innerWidth - widgetW() - MARGIN);
    var maxT = Math.max(MARGIN, window.innerHeight - widgetH() - MARGIN);
    return {
      left: Math.min(Math.max(MARGIN, left), maxL),
      top: Math.min(Math.max(MARGIN, top), maxT),
    };
  }

  function place(left, top) {
    var c = clamp(left, top);
    widget.style.left = c.left + "px";
    widget.style.top = c.top + "px";
    widget.style.right = "auto";
    widget.style.bottom = "auto";
  }

  // posición inicial: abajo a la derecha
  function initPos() {
    var left = window.innerWidth - widgetW() - MARGIN;
    var top = window.innerHeight - widgetH() - MARGIN;
    place(left, top);
  }
  initPos();

  // drag
  var dragging = false, dx = 0, dy = 0;

  function onDown(ev) {
    // no arrastrar si se clickea el botón minimizar
    if (ev.target.closest(".wbtn")) return;
    dragging = true;
    var rect = widget.getBoundingClientRect();
    var pt = pointer(ev);
    dx = pt.x - rect.left;
    dy = pt.y - rect.top;
    widget.classList.add("dragging");
    document.addEventListener("mousemove", onMove);
    document.addEventListener("mouseup", onUp);
    document.addEventListener("touchmove", onMove, { passive: false });
    document.addEventListener("touchend", onUp);
    ev.preventDefault();
  }

  function pointer(ev) {
    if (ev.touches && ev.touches.length) return { x: ev.touches[0].clientX, y: ev.touches[0].clientY };
    return { x: ev.clientX, y: ev.clientY };
  }

  function onMove(ev) {
    if (!dragging) return;
    var pt = pointer(ev);
    place(pt.x - dx, pt.y - dy);
    if (ev.cancelable) ev.preventDefault();
  }

  function onUp() {
    dragging = false;
    widget.classList.remove("dragging");
    document.removeEventListener("mousemove", onMove);
    document.removeEventListener("mouseup", onUp);
    document.removeEventListener("touchmove", onMove);
    document.removeEventListener("touchend", onUp);
  }

  titleBar.addEventListener("mousedown", onDown);
  titleBar.addEventListener("touchstart", onDown, { passive: false });

  // minimizar / restaurar (colapsa a la barra de título)
  minBtn.addEventListener("click", function (ev) {
    ev.stopPropagation();
    var min = widget.classList.toggle("min");
    minBtn.textContent = min ? "▢" : "▁";
    minBtn.title = min ? "Restaurar" : "Minimizar";
    // re-anclar dentro del viewport tras cambiar de alto (transición → reclamp al final)
    var rect = widget.getBoundingClientRect();
    place(rect.left, rect.top);
    setTimeout(function () {
      var r2 = widget.getBoundingClientRect();
      place(r2.left, r2.top);
      if (chart && !min) chart.resize();
    }, 240);
  });

  // mantener dentro del viewport al redimensionar la ventana
  window.addEventListener("resize", function () {
    var rect = widget.getBoundingClientRect();
    place(rect.left, rect.top);
  });
})();
</script>
</body>
</html>
