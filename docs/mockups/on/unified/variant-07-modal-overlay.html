<!doctype html>
<html lang="es" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ON Unificado · Modal overlay</title>
<link rel="stylesheet" href="../_shared/theme.css">
<link rel="stylesheet" href="../_shared/unified.css">
<style>
  /* ---- LAYOUT: tabla full-width 100vh + modal overlay del gráfico ---- */
  html, body { height: 100%; margin: 0; }
  .v7-shell { display: flex; flex-direction: column; height: 100vh; min-height: 0; }

  /* header terminal */
  .v7-head { display: flex; align-items: center; gap: 12px; padding: 9px 16px;
    background: var(--head-bg); color: var(--text-white); box-shadow: var(--shadow-panel);
    flex: 0 0 auto; z-index: 50; }
  .v7-head h1 { margin: 0; font-size: 14px; font-weight: 700; letter-spacing: .5px; white-space: nowrap; }
  .v7-head .v7-sub { color: #c7d0ee; font-size: 11.5px; }
  .v7-head .v7-gen { color: #8fa0d6; font-size: 10.5px; margin-left: 4px; }
  .v7-head .spacer { margin-left: auto; }
  .v7-head .v7-chip { background: #e8843a; color: #311; font-weight: 700; font-size: 10.5px;
    padding: 2px 7px; border-radius: 10px; }
  .v7-tbtn { background: rgba(255,255,255,.12); border: none; color: #fff; cursor: pointer;
    border-radius: 6px; padding: 5px 10px; font-size: 13px; line-height: 1; }
  .v7-tbtn:hover { background: rgba(255,255,255,.22); }

  /* botón "Ver gráfico" en el header */
  .v7-chartbtn { display: inline-flex; align-items: center; gap: 6px; cursor: pointer;
    background: var(--accent); color: #fff; border: none; border-radius: 7px;
    padding: 6px 12px; font: 700 12px var(--font-body); letter-spacing: .2px;
    transition: filter .15s ease, transform .12s ease; }
  .v7-chartbtn:hover { filter: brightness(1.1); transform: translateY(-1px); }
  .v7-chartbtn:active { transform: translateY(0); }

  /* tabla full-width, ocupa el alto disponible y scrollea internamente */
  #tool { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column;
    background: var(--panel-bg); }

  /* ---- modal overlay ---- */
  .v7-backdrop { position: fixed; inset: 0; z-index: 200; background: rgba(4,9,24,.62);
    backdrop-filter: blur(2px); display: flex; align-items: center; justify-content: center;
    opacity: 0; pointer-events: none; transition: opacity .2s ease; }
  .v7-backdrop.open { opacity: 1; pointer-events: auto; }

  .v7-modal { width: 680px; max-width: calc(100vw - 32px); height: 520px; max-height: calc(100vh - 48px);
    background: var(--panel-bg); border: 1px solid var(--panel-border); border-radius: var(--radius);
    box-shadow: 0 18px 60px rgba(0,0,0,.55); display: flex; flex-direction: column; overflow: hidden;
    transform: translateY(14px) scale(.98); opacity: 0; transition: transform .22s ease, opacity .22s ease; }
  .v7-backdrop.open .v7-modal { transform: translateY(0) scale(1); opacity: 1; }

  .v7-modal-head { display: flex; align-items: center; gap: 10px; padding: 10px 14px;
    background: var(--navy-band); color: #fff; flex: 0 0 auto; }
  .v7-modal-head .v7-mtitle { font-weight: 700; font-size: 12.5px; letter-spacing: .4px; }
  .v7-modal-head .v7-msub { color: #c7d0ee; font-size: 11px; font-family: var(--font-mono); }
  .v7-modal-head .spacer { margin-left: auto; }
  .v7-x { background: rgba(255,255,255,.12); border: none; color: #fff; cursor: pointer;
    width: 26px; height: 26px; border-radius: 6px; font-size: 15px; line-height: 1; }
  .v7-x:hover { background: rgba(255,255,255,.26); }

  .v7-modal-body { flex: 1 1 auto; min-height: 0; padding: 14px; position: relative; }
  .v7-canvas-wrap { position: absolute; inset: 14px; }
  .v7-hint { padding: 6px 14px 12px; color: var(--text-faint); font-size: 10.5px; flex: 0 0 auto; }

  /* selección activa (resaltado de sector) badge en el footer del modal */
  .v7-sel { color: var(--accent); font-weight: 700; }
</style>
</head>
<body>
  <div class="v7-shell">
    <header class="v7-head">
      <h1>O.N's · Unificado</h1>
      <span class="v7-sub">— Modal overlay</span>
      <span class="v7-gen" id="v7-gen"></span>
      <span class="spacer"></span>
      <button class="v7-chartbtn" id="v7-open">📊 Ver gráfico</button>
      <span class="v7-chip">BYMA open (20m)</span>
      <button class="v7-tbtn" title="Tema claro/oscuro" onclick="ON.toggleTheme()">◐</button>
    </header>

    <!-- tabla full-width: Unified.render se monta acá -->
    <div id="tool"></div>
  </div>

  <!-- ---- MODAL: el canvas existe en el DOM desde el inicio (modal oculto) ---- -->
  <div class="v7-backdrop" id="v7-backdrop" aria-hidden="true">
    <div class="v7-modal" role="dialog" aria-modal="true" aria-label="TIR vs MD por sector">
      <div class="v7-modal-head">
        <span class="v7-mtitle">TIR vs MD · por sector</span>
        <span class="v7-msub" id="v7-msub"></span>
        <span class="spacer"></span>
        <button class="v7-x" id="v7-close" title="Cerrar (Esc)">✕</button>
      </div>
      <div class="v7-modal-body">
        <div class="v7-canvas-wrap">
          <canvas id="v7-chart"></canvas>
        </div>
      </div>
      <div class="v7-hint">
        Burbuja = sector · radio ∝ Nº bonos · click para resaltar en la tabla.
        <span id="v7-selnote"></span>
      </div>
    </div>
  </div>

<script src="../_shared/on_data.js"></script>
<script src="../_shared/sectors.js"></script>
<script src="../_shared/chart.umd.min.js"></script>
<script src="../_shared/util.js"></script>
<script src="../_shared/unified.js"></script>
<script>
(function () {
  "use strict";

  // snapshot info en el header
  var gen = (ON.DATA && ON.DATA.generated) ? ("snapshot " + ON.DATA.generated.replace("T", " ")) : "";
  var meta = ON.DATA && ON.DATA.meta;
  document.getElementById("v7-gen").textContent =
    gen + (meta ? "  ·  " + meta.n_bonds + " ONs · AR " + meta.n_ar + " / EXT " + meta.n_ext : "");

  // ---- gráfico: bubble TIR(y) vs MD(x), una burbuja por sector ----
  var canvas = document.getElementById("v7-chart");
  var chart = null;
  var lastAggs = [];     // último set de aggs para recolorear sin recalcular
  var selSector = null;  // sector resaltado (toggle)

  function radius(count) { return Math.max(8, Math.min(28, 6 + count * 1.3)); }

  function buildDatasets(aggs) {
    return (aggs || []).filter(function (a) {
      return a.md_avg != null && a.tir_avg != null && a.count > 0;
    }).map(function (a) {
      return {
        label: a.short,
        data: [{ x: a.md_avg, y: a.tir_avg, _key: a.key, _short: a.short,
                 _count: a.count, _tir: a.tir_avg, _md: a.md_avg }],
        backgroundColor: a.color + "cc",
        borderColor: a.color,
        borderWidth: 2,
        radius: radius(a.count),
        hoverRadius: radius(a.count) + 3,
      };
    });
  }

  function options() {
    var t = ON.chartTheme();
    return {
      responsive: true,
      maintainAspectRatio: false,
      animation: { duration: 280 },
      onClick: function (evt, els) {
        if (!els || !els.length) return;
        var d = chart.data.datasets[els[0].datasetIndex];
        var key = d.data[0]._key;
        selSector = (selSector === key) ? null : key;
        Unified.highlight(selSector);          // toggle en la tabla
        updateSelNote();
      },
      scales: {
        x: {
          title: { display: true, text: "MD prom (años)", color: t.txt },
          ticks: { color: t.txt }, grid: { color: t.grid },
          border: { color: t.grid },
        },
        y: {
          title: { display: true, text: "TIR prom (%)", color: t.txt },
          ticks: { color: t.txt, callback: function (v) { return v + "%"; } },
          grid: { color: t.grid },
          border: { color: t.grid },
        },
      },
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: {
            label: function (c) {
              var r = c.raw || {};
              return r._short + " (" + r._count + " bonos) · TIR prom " +
                (r._tir != null ? r._tir.toFixed(2) : "?") + "% · MD prom " +
                (r._md != null ? r._md.toFixed(2) : "?") + " a";
            },
          },
        },
      },
    };
  }

  function ensureChart() {
    if (chart) return;
    chart = new Chart(canvas.getContext("2d"), {
      type: "bubble",
      data: { datasets: buildDatasets(lastAggs) },
      options: options(),
    });
  }

  function redraw(aggs) {
    if (aggs) lastAggs = aggs;
    if (!chart) { ensureChart(); return; }
    chart.data.datasets = buildDatasets(lastAggs);
    chart.options = options();   // refresca colores de ejes/grilla por si cambió el tema
    chart.update();
  }

  function recolor() {
    if (!chart) return;
    chart.options = options();
    chart.data.datasets = buildDatasets(lastAggs);
    chart.update();
  }

  function updateSelNote() {
    var note = document.getElementById("v7-selnote");
    var sub = document.getElementById("v7-msub");
    if (selSector) {
      var m = ON.sectorMeta(selSector);
      note.innerHTML = '· resaltado: <span class="v7-sel">' + m.short + '</span> (click de nuevo para limpiar)';
      sub.textContent = m.short;
    } else {
      note.textContent = "";
      sub.textContent = "";
    }
  }

  // crear la instancia al cargar (modal oculto con opacity/pointer-events, no display:none → mide bien)
  lastAggs = Unified.sectorAggs();
  ensureChart();
  updateSelNote();

  // recolorear/redibujar al cambiar de tema
  window.addEventListener("on:themechange", recolor);

  // ---- montaje de la tabla: el gráfico sigue el filtro vía onRender ----
  Unified.render(document.getElementById("tool"), {
    defaultCcy: "MEP",
    onRender: function (bonds, aggs) {
      // si el sector resaltado ya no está visible, limpiar selección
      if (selSector && !aggs.some(function (a) { return a.key === selSector; })) {
        selSector = null; updateSelNote();
      }
      redraw(aggs);
    },
  });

  // ---- modal: abrir / cerrar (X, backdrop, ESC) ----
  var backdrop = document.getElementById("v7-backdrop");
  function openModal() {
    backdrop.classList.add("open");
    backdrop.setAttribute("aria-hidden", "false");
    // resize por si el contenedor cambió de tamaño mientras estuvo oculto
    if (chart) requestAnimationFrame(function () { chart.resize(); chart.update("none"); });
  }
  function closeModal() {
    backdrop.classList.remove("open");
    backdrop.setAttribute("aria-hidden", "true");
  }
  document.getElementById("v7-open").onclick = openModal;
  document.getElementById("v7-close").onclick = closeModal;
  backdrop.addEventListener("click", function (e) {
    if (e.target === backdrop) closeModal();   // click en el backdrop (no en la card)
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && backdrop.classList.contains("open")) closeModal();
  });
})();
</script>
</body>
</html>
