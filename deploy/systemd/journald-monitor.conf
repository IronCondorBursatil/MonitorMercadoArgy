# Se instala en /etc/systemd/journald.conf.d/monitor.conf
#
# El journal es el destino REAL de los logs de la app: `settings.setup_logging` manda
# a stdout sólo WARNING+ y los access de 4xx/5xx, y systemd los captura. Sin tope, el
# default de journald es el 10% del filesystem — 19 GB en esta caja.
[Journal]
SystemMaxUse=300M
SystemKeepFree=1G
MaxRetentionSec=90day
