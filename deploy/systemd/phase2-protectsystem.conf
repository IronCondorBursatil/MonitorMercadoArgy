# FASE 2 del hardening. Se instala como drop-in:
#   sudo install -m 644 deploy/systemd/phase2-protectsystem.conf \
#        /etc/systemd/system/monitores.service.d/phase2.conf
#   sudo systemctl daemon-reload && sudo systemctl restart monitores
#
# ⚠ REQUISITO: el servidor tiene que estar corriendo el código que saca
# `cartera.json` y `monitores_global.log` del working tree (los dos cuelgan de
# `db_dir` vía `_DB_DERIVED`). Con el código anterior el RotatingFileHandler rota con
# **rename en la raíz del repo** y `ProtectSystem=strict` lo convierte en un
# PermissionError en cada rotación. Por eso `install-config.sh` NO lo instala solo:
# es un paso posterior y deliberado.
#
# Verificar antes:  ls -la /var/lib/monitor/{cartera.json,monitores_global.log}
# Verificar después: systemd-analyze security monitores.service   (objetivo ≤ 2.0)
#                    y el smoke de escritura: guardar layout, alta en cartera,
#                    /on/pdf, guardar+borrar credenciales BYMA.
#
# Rollback: borrar el drop-in, daemon-reload, restart.

[Service]
# Todo /usr y /etc en read-only. `StateDirectory=monitor` y `CacheDirectory=monitor`
# (declarados en el unit principal) siguen siendo escribibles.
ProtectSystem=strict

# `read-only`, NO `yes`: el repo vive en /home/ubuntu y con `yes` sería inaccesible.
ProtectHome=read-only

# El único archivo del árbol que la app sigue escribiendo: la UI de credenciales BYMA
# reescribe `.env`. El `-` lo hace no-fatal si falta, pero entonces `save_credentials`
# no puede crearlo sobre un root read-only → `deploy.sh` hace `touch .env; chmod 600`.
ReadWritePaths=-/home/ubuntu/MonitorMercadoArgy/.env
