# Sitio nginx del Monitor. VERSIONADO: es la única fuente: `deploy.sh` lo instala en
# /etc/nginx/sites-available/monitores con diff-then-install, corre `nginx -t` y
# recarga. Editarlo a mano en el servidor lo pisa el próximo deploy.
#
# `server_name _` (catch-all) a propósito: la IP pública cambió una vez ya
# (129.213.38.104 efímera → 129.80.148.166 reservada) y con la IP hardcodeada —como
# estaba en el droplet— el sitio deja de responder hasta que alguien edite esto.

# Rate limit del POST de /login. El limiter de la app (`routers/auth.py`) vive EN
# MEMORIA y se resetea en cada `deploy.sh`; este sobrevive al restart de la app.
# La clave es vacía salvo para POST: refrescar el formulario nunca se throttlea.
map $request_method $login_key {
    default "";
    POST    $binary_remote_addr;
}
limit_req_zone $login_key zone=login:1m rate=10r/m;
limit_req_status 429;

server {
    listen 80 default_server;
    server_name _;

    # No publicar la versión de nginx en las respuestas ni en las páginas de error.
    server_tokens off;

    # A nivel SERVER para que las location las hereden: una location que declara
    # cualquier `proxy_set_header` propio DESCARTA los del nivel de arriba, y perder
    # `Host` rompería la validación de origen del CSRF (compara Origin contra Host).
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # uvicorn confía en el XFF sólo si el peer está en `forwarded_allow_ips`
    # (default "127.0.0.1"), que es exactamente este proxy.
    location = /login {
        limit_req zone=login burst=5 nodelay;
        proxy_pass http://127.0.0.1:8000;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;

        # SSE (/stream): sin esto el buffer de nginx retiene los eventos y los
        # paneles dejan de auto-refrescarse.
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
}
